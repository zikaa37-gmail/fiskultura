<svg viewBox="0 0 240 160" role="img" [attr.aria-label]="label()">
  @switch (name()) {
    @case ('court-full') {
      <rect class="rp-floor" x="10" y="21" width="220" height="118" rx="3" />
      <rect class="rp-paint" x="10" y="60.8" width="45.6" height="38.4" />
      <rect class="rp-paint" x="184.4" y="60.8" width="45.6" height="38.4" />
      <g class="rp-lines">
        <rect x="10" y="21" width="220" height="118" rx="3" />
        <line x1="120" y1="21" x2="120" y2="139" />
        <circle cx="120" cy="80" r="14.1" />
        <rect x="10" y="60.8" width="45.6" height="38.4" />
        <rect x="184.4" y="60.8" width="45.6" height="38.4" />
        <path d="M55.6 65.9 A14.1 14.1 0 0 1 55.6 94.1" />
        <path d="M184.4 65.9 A14.1 14.1 0 0 0 184.4 94.1" />
        <path d="M10 28.1 H33.5 A53 53 0 0 1 33.5 131.9 H10" />
        <path d="M230 28.1 H206.5 A53 53 0 0 0 206.5 131.9 H230" />
      </g>
      <circle class="rp-hoop" cx="22.4" cy="80" r="3.5" />
      <circle class="rp-hoop" cx="217.6" cy="80" r="3.5" />
      <use href="#rp-ball" transform="translate(120 80) scale(0.9)" />
    }

    @case ('court-hoop') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="170" y1="140" x2="170" y2="40" />
      <line class="rp-pole" x1="170" y1="40" x2="150" y2="40" />
      <use href="#rp-hoop" transform="translate(138 44) scale(1.4)" />
      <g class="rp-measure">
        <line x1="112" y1="44" x2="112" y2="140" />
        <path d="M107 50 L112 44 L117 50 M107 134 L112 140 L117 134" />
      </g>
      <text class="rp-tag" x="88" y="96" text-anchor="end">3,05 m</text>
      <g appRuleFigure [x]="32" [y]="140" [scale]="0.7" team="us" [rightArm]="[10, -28]" />
      <use href="#rp-ball" transform="translate(46 61)" />
    }

    @case ('court-halves') {
      <rect class="rp-zone-back" x="10" y="25" width="110" height="110" />
      <rect class="rp-zone-front" x="120" y="25" width="110" height="110" />
      <g class="rp-lines">
        <rect x="10" y="25" width="220" height="110" />
        <line x1="120" y1="25" x2="120" y2="135" />
      </g>
      <circle class="rp-hoop" cx="23" cy="80" r="4" />
      <circle class="rp-hoop" cx="217" cy="80" r="4" />
      <path class="rp-arrow-ok rp-anim-push" d="M45 80 H190 m-12 -12 l12 12 l-12 12" />
      <text class="rp-tag" x="65" y="45" text-anchor="middle">naš koš</text>
      <text class="rp-tag" x="175" y="45" text-anchor="middle">napadamo</text>
    }

    @case ('court-paint') {
      <rect class="rp-floor" x="10" y="10" width="220" height="140" />
      <rect class="rp-paint rp-anim-glow" [attr.x]="halfCourt.keyLeft" y="10" [attr.width]="halfCourt.keyWidth" [attr.height]="halfCourt.keyDepth" />
      <g class="rp-lines">
        <rect x="10" y="10" width="220" height="140" />
        <rect [attr.x]="halfCourt.keyLeft" y="10" [attr.width]="halfCourt.keyWidth" [attr.height]="halfCourt.keyDepth" />
        <path [attr.d]="halfFreeThrow" />
        <path [attr.d]="halfArc" />
      </g>
      <use href="#rp-hoop" [attr.transform]="'translate(120 ' + halfCourt.basketY + ')'" />
      <text class="rp-tag" x="120" y="60" text-anchor="middle">reket</text>
    }

    @case ('shot-spots') {
      <rect class="rp-floor" x="10" y="10" width="220" height="145" />
      <rect class="rp-paint" [attr.x]="halfCourt.keyLeft" y="10" [attr.width]="halfCourt.keyWidth" [attr.height]="halfCourt.keyDepth" />
      <g class="rp-lines">
        <rect x="10" y="10" width="220" height="145" />
        <rect [attr.x]="halfCourt.keyLeft" y="10" [attr.width]="halfCourt.keyWidth" [attr.height]="halfCourt.keyDepth" />
        <path [attr.d]="halfFreeThrow" />
        <path [attr.d]="halfNoCharge" />
        <path class="rp-three-line" [attr.d]="halfArc" />
      </g>
      <use href="#rp-hoop" [attr.transform]="'translate(120 ' + halfCourt.basketY + ')'" />
      @for (spot of spots; track $index; let index = $index) {
        <g
          class="rp-spot"
          [class.rp-spot-open]="isRevealed(index)"
          [class.rp-spot-1]="spot.points === 1"
          [class.rp-spot-2]="spot.points === 2"
          [class.rp-spot-3]="spot.points === 3"
          [attr.transform]="'translate(' + spot.x + ' ' + spot.y + ')'"
          (click)="toggleSpot(index, $event)"
          [attr.role]="interactive() ? 'button' : null"
          [attr.aria-label]="interactive() ? (isRevealed(index) ? spot.points + ' poena' : 'Otkrij koliko vredi šut') : null"
          [attr.data-testid]="'shot-spot-' + index"
        >
          <circle r="10" />
          <text y="4.5" text-anchor="middle">{{ interactive() && !isRevealed(index) ? '?' : spot.points }}</text>
        </g>
      }
      @if (interactive()) {
        <g class="rp-reveal-all" transform="translate(205 148)" (click)="revealAll($event)" role="button" aria-label="Otkrij sve" data-testid="shot-spots-all">
          <rect x="-26" y="-9" width="52" height="16" rx="8" />
          <text y="3" text-anchor="middle">{{ revealed().length === spots.length ? 'sakrij' : 'otkrij sve' }}</text>
        </g>
      }
    }

    @case ('shot-line-foot') {
      <rect class="rp-floor" x="0" y="120" width="240" height="40" />
      <path class="rp-three-line" d="M0 140 H240" />
      <text class="rp-tag" x="40" y="156" text-anchor="middle">unutra</text>
      <text class="rp-tag" x="200" y="156" text-anchor="middle">iza linije</text>
      <use href="#rp-foot" class="rp-foot-bad" transform="translate(105 138) rotate(90)" />
      <use href="#rp-foot" transform="translate(140 128) rotate(90)" />
      <g appRuleFigure [x]="122" [y]="122" [scale]="0.75" team="us" legs="jump" [leftArm]="[4, -28]" [rightArm]="[-4, -28]" />
      <use href="#rp-ball" transform="translate(122 30)" />
      <text class="rp-big" x="40" y="70" text-anchor="middle">2</text>
    }

    @case ('scoreboard') {
      <rect class="rp-board-bg" x="40" y="30" width="160" height="80" rx="10" />
      <text class="rp-board-team" x="80" y="55" text-anchor="middle">DOMAĆI</text>
      <text class="rp-board-team" x="160" y="55" text-anchor="middle">GOSTI</text>
      <text class="rp-board-score rp-board-win" x="80" y="95" text-anchor="middle">78</text>
      <text class="rp-board-score" x="160" y="95" text-anchor="middle">71</text>
      <path class="rp-crown" d="M62 18 L68 6 L74 14 L80 4 L86 14 L92 6 L98 18 Z" />
      <text class="rp-tag" x="120" y="140" text-anchor="middle">nerešeno? → produžetak</text>
    }

    @case ('team-five') {
      <rect class="rp-floor" x="5" y="20" width="230" height="130" rx="3" />
      <line class="rp-lines" x1="120" y1="20" x2="120" y2="150" />
      @for (pos of [[30, 70], [55, 135], [75, 95], [95, 60], [100, 140]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.42" team="us" [number]="$index + 4" />
      }
      @for (pos of [[140, 70], [150, 140], [175, 95], [200, 60], [212, 135]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.42" team="them" />
      }
      <text class="rp-big" x="60" y="40" text-anchor="middle">5</text>
      <text class="rp-big" x="180" y="40" text-anchor="middle">5</text>
    }

    @case ('team-sub') {
      <rect class="rp-table" x="140" y="95" width="90" height="25" rx="3" />
      <text class="rp-tag-light" x="185" y="112" text-anchor="middle">zapisnik</text>
      <g appRuleFigure [x]="120" [y]="145" [scale]="0.8" team="us" number="7" />
      <g appRuleFigure [x]="40" [y]="145" [scale]="0.8" team="ref" [leftArm]="[20, -6]" [rightArm]="[-20, -6]" leftHand="flat" rightHand="flat" />
      <path class="rp-arrow-ok rp-anim-push" d="M92 70 H70 m10 -9 l-10 9 l10 9" />
    }

    @case ('team-bench') {
      <rect class="rp-bench" x="10" y="120" width="220" height="12" rx="4" />
      @for (x of [22, 40, 58, 76, 94, 112, 130, 148, 166, 184, 202, 220]; track x) {
        <g appRuleFigure [x]="x" [y]="120" [scale]="0.33" team="us" [leftArm]="[2, 22]" [rightArm]="[-2, 22]" />
      }
      <text class="rp-big" x="120" y="40" text-anchor="middle">12</text>
    }

    @case ('jump-ball') {
      <ellipse class="rp-lines" cx="120" cy="150" rx="70" ry="9" />
      <g appRuleFigure [x]="92" [y]="150" [scale]="0.9" team="us" legs="jump" [rightArm]="[14, -30]" [leftArm]="[-8, 28]" />
      <g appRuleFigure [x]="148" [y]="150" [scale]="0.9" team="them" legs="jump" [leftArm]="[-14, -30]" />
      <g class="rp-anim-toss"><use href="#rp-ball" transform="translate(120 30)" /></g>
    }

    @case ('held-ball') {
      <g appRuleFigure [x]="90" [y]="150" [scale]="0.95" team="us" [rightArm]="[22, 8]" [leftArm]="[30, 10]" />
      <g appRuleFigure [x]="150" [y]="150" [scale]="0.95" team="them" [leftArm]="[-22, 8]" [rightArm]="[-30, 10]" />
      <use href="#rp-ball" transform="translate(120 72) scale(1.3)" />
      <path class="rp-shake" d="M100 50 l6 -6 M140 50 l-6 -6 M120 40 v-8" />
    }

    @case ('possession-arrow') {
      <rect class="rp-table" x="70" y="110" width="100" height="22" rx="4" />
      <g class="rp-anim-flip" style="transform-origin: 120px 70px">
        <path class="rp-arrow-big" d="M85 70 H155 m-18 -18 l18 18 l-18 18" />
      </g>
      <g appRuleFigure [x]="35" [y]="150" [scale]="0.8" team="us" [leftArm]="[-8, -28]" [rightArm]="[8, -28]" />
      <g appRuleFigure [x]="205" [y]="150" [scale]="0.8" team="them" [leftArm]="[-8, -28]" [rightArm]="[8, -28]" />
    }

    @case ('dribble-ok') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[18, 22]" />
      <g class="rp-anim-bounce"><use href="#rp-ball" transform="translate(132 100) scale(1.2)" /></g>
    }

    @case ('dribble-two-hands') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" legs="wide" [leftArm]="[1, 34]" [rightArm]="[-1, 34]" leftHand="flat" rightHand="flat" />
      <g class="rp-anim-bounce"><use href="#rp-ball" transform="translate(120 106) scale(1.3)" /></g>
      <path class="rp-impact" d="M96 112 l-8 4 M144 112 l8 4" />
    }

    @case ('travel') {
      <rect class="rp-floor" x="0" y="100" width="240" height="60" />
      <g class="rp-step rp-step-1"><use href="#rp-foot" transform="translate(50 135) rotate(80)" /><text class="rp-step-no" x="50" y="122" text-anchor="middle">1</text></g>
      <g class="rp-step rp-step-2"><use href="#rp-foot" transform="translate(110 125) rotate(100)" /><text class="rp-step-no" x="110" y="112" text-anchor="middle">2</text></g>
      <g class="rp-step rp-step-3 rp-step-bad"><use href="#rp-foot" transform="translate(170 135) rotate(80)" /><text class="rp-step-no" x="170" y="122" text-anchor="middle">3</text></g>
      <g appRuleFigure [x]="110" [y]="95" [scale]="0.75" team="us" legs="run" [leftArm]="[18, 10]" [rightArm]="[2, 12]" />
      <use href="#rp-ball" transform="translate(126 32)" />
    }

    @case ('two-steps') {
      <rect class="rp-floor" x="0" y="100" width="240" height="60" />
      <g class="rp-step rp-step-1"><use href="#rp-foot" transform="translate(60 135) rotate(80)" /><text class="rp-step-no" x="60" y="122" text-anchor="middle">1</text></g>
      <g class="rp-step rp-step-2"><use href="#rp-foot" transform="translate(125 125) rotate(100)" /><text class="rp-step-no" x="125" y="112" text-anchor="middle">2</text></g>
      <use href="#rp-hoop" transform="translate(210 30) scale(1.3)" />
      <g class="rp-step rp-step-3"><path class="rp-arrow-ok" d="M150 60 Q180 20 200 30" /></g>
      <g appRuleFigure [x]="125" [y]="95" [scale]="0.75" team="us" legs="jump" [rightArm]="[16, -26]" />
      <use href="#rp-ball" transform="translate(145 25)" />
    }

    @case ('pivot') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <circle class="rp-pivot-ring" cx="110" cy="95" r="16" />
      <use href="#rp-foot" class="rp-foot-ok" transform="translate(110 95)" />
      <g class="rp-anim-pivot" style="transform-origin: 110px 95px">
        <use href="#rp-foot" transform="translate(150 100) rotate(20)" />
        <path class="rp-dash" d="M150 70 A45 45 0 0 1 160 125" />
      </g>
      <text class="rp-tag" x="110" y="140" text-anchor="middle">stajna noga stoji</text>
    }

    @case ('carry') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[22, 14]" rightHand="flat" />
      <use href="#rp-ball" transform="translate(133 74) scale(1.2)" />
      <path class="rp-dash" d="M150 74 q12 -12 24 0" />
    }

    @case ('ball-in') {
      <rect class="rp-floor" x="20" y="20" width="150" height="120" />
      <line class="rp-boundary" x1="170" y1="20" x2="170" y2="140" />
      <use href="#rp-ball" transform="translate(120 80) scale(1.6)" />
    }

    @case ('ball-on-line') {
      <rect class="rp-floor" x="20" y="20" width="150" height="120" />
      <line class="rp-boundary" x1="170" y1="20" x2="170" y2="140" />
      <use href="#rp-ball" transform="translate(170 80) scale(1.6)" />
    }

    @case ('ball-out') {
      <rect class="rp-floor" x="20" y="20" width="150" height="120" />
      <line class="rp-boundary" x1="170" y1="20" x2="170" y2="140" />
      <use href="#rp-ball" transform="translate(205 80) scale(1.6)" />
    }

    @case ('foot-on-line') {
      <rect class="rp-floor" x="0" y="20" width="170" height="140" />
      <line class="rp-boundary" x1="170" y1="20" x2="170" y2="160" />
      <g appRuleFigure [x]="160" [y]="150" [scale]="1" team="us" [leftArm]="[-20, 10]" />
      <use href="#rp-ball" transform="translate(131 87) scale(1.2)" />
      <circle class="rp-highlight" cx="167" cy="150" r="9" />
    }

    @case ('throw-in') {
      <rect class="rp-floor" x="0" y="20" width="150" height="140" />
      <line class="rp-boundary" x1="150" y1="20" x2="150" y2="160" />
      <g appRuleFigure [x]="190" [y]="150" [scale]="1" team="us" [leftArm]="[-10, -28]" [rightArm]="[-28, -24]" />
      <use href="#rp-ball" transform="translate(167 46) scale(1.2)" />
      <path class="rp-arrow-ok" d="M150 50 H90 m10 -9 l-10 9 l10 9" />
      <g class="rp-clock-mini" transform="translate(40 40)">
        <rect x="-22" y="-16" width="44" height="32" rx="6" />
        <text class="rp-count" y="8" text-anchor="middle"><tspan class="rp-count-5">5</tspan></text>
      </g>
    }

    @case ('clock-24') {
      <rect class="rp-board-bg" x="65" y="25" width="110" height="80" rx="10" />
      <text class="rp-clock-digits rp-anim-tick" x="120" y="88" text-anchor="middle">24</text>
      <use href="#rp-hoop" transform="translate(120 130) scale(1.2)" />
    }

    @case ('clock-14') {
      <rect class="rp-board-bg" x="20" y="25" width="90" height="70" rx="10" />
      <text class="rp-clock-digits" x="65" y="80" text-anchor="middle">14</text>
      <use href="#rp-hoop" transform="translate(185 40) scale(1.3)" />
      <g appRuleFigure [x]="175" [y]="150" [scale]="0.75" team="us" legs="jump" [leftArm]="[-2, -30]" [rightArm]="[6, -30]" />
      <use href="#rp-ball" transform="translate(178 62)" />
    }

    @case ('eight-sec') {
      <rect class="rp-zone-back" x="10" y="30" width="110" height="100" />
      <rect class="rp-zone-front" x="120" y="30" width="110" height="100" />
      <line class="rp-lines" x1="120" y1="30" x2="120" y2="130" />
      <g class="rp-anim-cross"><use href="#rp-ball" transform="translate(40 80) scale(1.3)" /></g>
      <g class="rp-clock-mini" transform="translate(60 150)">
        <rect x="-18" y="-13" width="36" height="24" rx="5" />
        <text class="rp-count" y="6" text-anchor="middle">8</text>
      </g>
    }

    @case ('three-sec') {
      <rect class="rp-floor" x="10" y="10" width="220" height="140" />
      <rect class="rp-paint" [attr.x]="halfCourt.keyLeft" y="10" [attr.width]="halfCourt.keyWidth" [attr.height]="halfCourt.keyDepth" />
      <rect class="rp-lines" [attr.x]="halfCourt.keyLeft" y="10" [attr.width]="halfCourt.keyWidth" [attr.height]="halfCourt.keyDepth" />
      <use href="#rp-hoop" [attr.transform]="'translate(120 ' + halfCourt.basketY + ')'" />
      <g appRuleFigure [x]="120" [y]="88" [scale]="0.5" team="us" />
      <text class="rp-count rp-count-seq" x="190" y="70" text-anchor="middle">
        <tspan class="rp-seq rp-seq-1" x="190">1</tspan>
        <tspan class="rp-seq rp-seq-2" x="190">2</tspan>
        <tspan class="rp-seq rp-seq-3 rp-seq-bad" x="190">3</tspan>
      </text>
    }

    @case ('five-sec-guarded') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="1" team="us" [leftArm]="[20, 6]" [rightArm]="[-2, 10]" />
      <use href="#rp-ball" transform="translate(78 82) scale(1.2)" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="1" team="them" legs="wide" [leftArm]="[-26, -14]" [rightArm]="[-6, -30]" />
      <g class="rp-clock-mini" transform="translate(200 30)">
        <rect x="-18" y="-13" width="36" height="24" rx="5" />
        <text class="rp-count" y="6" text-anchor="middle">5</text>
      </g>
    }

    @case ('backcourt-ok') {
      <rect class="rp-zone-back" x="10" y="30" width="110" height="100" />
      <rect class="rp-zone-front" x="120" y="30" width="110" height="100" />
      <line class="rp-lines" x1="120" y1="30" x2="120" y2="130" />
      <path class="rp-arrow-ok" d="M50 80 H185 m-12 -12 l12 12 l-12 12" />
      <use href="#rp-ball" transform="translate(50 80) scale(1.3)" />
    }

    @case ('backcourt-bad') {
      <rect class="rp-zone-back" x="10" y="30" width="110" height="100" />
      <rect class="rp-zone-front" x="120" y="30" width="110" height="100" />
      <line class="rp-lines" x1="120" y1="30" x2="120" y2="130" />
      <path class="rp-arrow-bad" d="M190 80 H60 m12 -12 l-12 12 l12 12" />
      <use href="#rp-ball" transform="translate(190 80) scale(1.3)" />
    }

    @case ('backcourt-steal') {
      <rect class="rp-zone-back" x="10" y="30" width="110" height="100" />
      <rect class="rp-zone-front" x="120" y="30" width="110" height="100" />
      <line class="rp-lines" x1="120" y1="30" x2="120" y2="130" />
      <g appRuleFigure [x]="180" [y]="125" [scale]="0.6" team="them" [leftArm]="[-22, -4]" />
      <path class="rp-arrow-them" d="M150 75 H75 m12 -12 l-12 12 l12 12" />
      <g appRuleFigure [x]="55" [y]="125" [scale]="0.6" team="us" legs="run" [rightArm]="[20, -2]" />
      <use href="#rp-ball" transform="translate(75 75) scale(1.2)" />
    }

    @case ('foul-push') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="1" team="them" legs="run" [leftArm]="[30, -4]" [rightArm]="[34, 0]" leftHand="flat" rightHand="flat" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="1" team="us" legs="run" [leftArm]="[18, -6]" />
      <path class="rp-impact" d="M134 60 l8 -6 M134 70 l10 0 M134 80 l8 6" />
    }

    @case ('foul-hold') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="80" [y]="140" [scale]="1" team="them" [rightArm]="[40, 6]" rightHand="fist" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[24, 18]" />
      <use href="#rp-ball" transform="translate(178 104)" />
    }

    @case ('foul-shooter') {
      <use href="#rp-hoop" transform="translate(200 30) scale(1.3)" />
      <g appRuleFigure [x]="140" [y]="150" [scale]="0.95" team="us" legs="jump" [rightArm]="[10, -30]" [leftArm]="[2, -30]" />
      <use href="#rp-ball" transform="translate(152 48)" />
      <g appRuleFigure [x]="85" [y]="150" [scale]="0.95" team="them" legs="jump" [rightArm]="[46, -36]" rightHand="flat" />
