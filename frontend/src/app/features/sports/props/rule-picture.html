<svg viewBox="0 0 240 160" role="img" [attr.aria-label]="label()">
  @switch (name()) {
    @case ('rope-length') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" [leftArm]="[-14, 6]" [rightArm]="[14, 6]" />
      <path class="rp-pr-rope" d="M75 72 Q80 120 100 140 Q120 120 125 72" />
      <path class="rp-dash" d="M130 72 H150 M110 140 H140" />
      <text class="rp-tag" x="154" y="76">do pazuha</text>
      <text class="rp-tag" x="144" y="132">sredina vijače</text>
    }

    @case ('rope-grip') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="65" [y]="140" [scale]="1" team="us" />
      <path class="rp-pr-rope" d="M48 96 C44 150 86 150 82 96" />
      <g appRuleFigure [x]="175" [y]="140" [scale]="1" team="us" [leftArm]="[-2, 26]" [rightArm]="[2, 26]" />
      <path class="rp-pr-rope" d="M162 90 H188 M162 94 H188 M162 90 Q156 92 162 94 M188 90 Q194 92 188 94" />
      <text class="rp-tag" x="65" y="154" text-anchor="middle">otvorena</text>
      <text class="rp-tag" x="175" y="154" text-anchor="middle">presavijena</text>
    }

    @case ('rope-tangle') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="130" [scale]="1" team="us" legs="jump" />
      <path class="rp-pr-rope" d="M103 86 C98 140 116 118 120 126 C124 118 142 140 137 86" />
      <circle class="rp-highlight" cx="120" cy="124" r="16" />
      <text class="rp-tag" x="120" y="24" text-anchor="middle">kači se za stopala</text>
    }

    @case ('rope-single') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="128" [scale]="1" team="us" legs="jump" />
      <path class="rp-pr-rope" d="M103 84 C96 150 144 150 137 84" />
      <path class="rp-arrow-ok" d="M60 120 V84 m-8 8 l8 -8 l8 8" />
      <text class="rp-tag" x="60" y="154" text-anchor="middle">sunožno</text>
    }

    @case ('rope-series') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g class="rp-anim-cheer">
        <g appRuleFigure [x]="120" [y]="130" [scale]="1" team="us" legs="jump" />
        <path class="rp-pr-rope" d="M103 86 C84 0 156 0 137 86" />
      </g>
      <text class="rp-tag" x="120" y="154" text-anchor="middle">sa prstiju, tiho</text>
    }

    @case ('rope-run') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="110" [y]="140" [scale]="1" team="us" legs="run" />
      <path class="rp-pr-rope" d="M93 96 C88 150 132 150 127 96" />
      <path class="rp-arrow-ok rp-anim-push" d="M160 90 H196 m-9 -9 l9 9 l-9 9" />
      <text class="rp-tag" x="110" y="28" text-anchor="middle">trčeći korak</text>
    }

    @case ('rope-heels') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" />
      <path class="rp-pr-rope" d="M103 96 C98 150 142 150 137 96" />
      <path class="rp-impact" d="M96 142 l-10 -6 M96 148 l-12 2 M144 142 l10 -6 M144 148 l12 2" />
      <text class="rp-tag" x="120" y="24" text-anchor="middle">glasno, na pete</text>
    }

    @case ('rope-space') {
      <rect class="rp-floor" x="0" y="130" width="240" height="30" />
      <g appRuleFigure [x]="55" [y]="130" [scale]="0.8" team="us" />
      <path class="rp-pr-rope" d="M45 95 C40 140 70 140 65 95" />
      <g appRuleFigure [x]="185" [y]="130" [scale]="0.8" team="them" />
      <path class="rp-pr-rope" d="M175 95 C170 140 200 140 195 95" />
      <g class="rp-measure">
        <line x1="78" y1="112" x2="162" y2="112" />
        <path d="M84 107 L78 112 L84 117 M156 107 L162 112 L156 117" />
      </g>
      <text class="rp-tag rp-tag-ok" x="120" y="100" text-anchor="middle">najmanje 3 m</text>
    }

    @case ('rope-circle') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <path class="rp-pr-turn" d="M70 96 A52 52 0 1 1 170 96 M162 90 L170 96 L176 88" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" legs="wide" [leftArm]="[-5, -34]" [rightArm]="[5, -34]" leftHand="none" rightHand="none" />
      <path class="rp-pr-rope rp-pr-rope-taut" d="M104 32 H136" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">zategnuta</text>
    }

    @case ('rope-twist') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <path class="rp-pr-turn" d="M78 40 Q120 22 162 40 M84 32 L78 40 L88 42 M156 32 L162 40 L152 42" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" legs="wide" [leftArm]="[-5, 16]" [rightArm]="[5, 16]" leftHand="none" rightHand="none" />
      <path class="rp-pr-rope rp-pr-rope-taut" d="M104 82 H136" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">zasuk levo–desno</text>
    }

    @case ('rope-side-hops') {
      <rect class="rp-floor" x="0" y="120" width="240" height="40" />
      <path class="rp-pr-rope" d="M124 158 Q130 140 118 122" />
      <g appRuleFigure [x]="88" [y]="146" [scale]="1" team="us" legs="jump" />
      <g class="rp-pr-ghost">
        <g appRuleFigure [x]="160" [y]="146" [scale]="1" team="us" legs="jump" />
      </g>
      <path class="rp-pr-turn" d="M98 40 Q124 14 150 40 M143 34 L150 40 L150 31" />
      <text class="rp-tag" x="206" y="110" text-anchor="middle">sunožno</text>
    }

    @case ('rope-loose') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" legs="wide" [leftArm]="[-5, -34]" [rightArm]="[5, -34]" leftHand="none" rightHand="none" />
      <path class="rp-pr-rope" d="M104 32 Q120 74 136 32" />
      <circle class="rp-highlight" cx="120" cy="54" r="14" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">labava vijača</text>
    }

    @case ('hoop-grip') {
      <circle class="rp-pr-hoop" cx="120" cy="96" r="56" />
      <ellipse class="rp-hand-big" cx="120" cy="40" rx="18" ry="10" />
      <ellipse class="rp-hand-big" cx="103" cy="47" rx="7" ry="4" transform="rotate(-25 103 47)" />
      <path class="rp-dash" d="M78 58 L96 50" />
      <text class="rp-tag" x="56" y="66" text-anchor="middle">palac vodi</text>
      <text class="rp-tag" x="120" y="100" text-anchor="middle">nathvat</text>
    }

    @case ('hoop-swing') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" [rightArm]="[14, 14]" />
      <ellipse class="rp-pr-hoop" cx="128" cy="108" rx="7" ry="28" />
      <path class="rp-pr-turn" d="M150 84 Q166 108 150 132 M146 91 L150 84 L157 88 M146 125 L150 132 L157 128" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">napred–nazad</text>
    }

    @case ('hoop-roll') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="85" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[30, 18]" />
      <circle class="rp-pr-hoop" cx="140" cy="112" r="28" />
      <path class="rp-arrow-ok rp-anim-push" d="M178 112 H210 m-9 -9 l9 9 l-9 9" />
      <text class="rp-tag" x="120" y="28" text-anchor="middle">uspravno, ruka odozgo</text>
    }

    @case ('hoop-hip') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" legs="wide" [leftArm]="[-8, -32]" [rightArm]="[8, -32]" />
      <ellipse class="rp-pr-hoop" cx="120" cy="100" rx="36" ry="9" />
      <path class="rp-pr-turn" d="M80 116 Q120 130 160 116 M152 112 L160 116 L154 123" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">pokret kukovima</text>
    }

    @case ('hoop-wobble') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <path class="rp-dash" d="M20 138 Q45 126 70 138 T120 138" />
      <ellipse class="rp-pr-hoop" cx="140" cy="110" rx="22" ry="30" transform="rotate(18 140 110)" />
      <path class="rp-shake" d="M172 84 l8 -4 M174 98 l9 0 M108 88 l-8 -4" />
      <text class="rp-tag" x="110" y="28" text-anchor="middle">obruč krivuda</text>
    }

    @case ('hoop-through') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" legs="run" [leftArm]="[-25, 16]" [rightArm]="[25, 16]" />
      <circle class="rp-pr-hoop" cx="120" cy="100" r="40" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">korak kroz obruč</text>
    }

    @case ('hoop-hops') {
      <rect class="rp-floor" x="0" y="112" width="240" height="48" />
      <ellipse class="rp-pr-hoop" cx="134" cy="136" rx="60" ry="14" />
      <g appRuleFigure [x]="64" [y]="138" [scale]="0.9" team="us" legs="run" />
      <path class="rp-pr-turn" d="M150 116 A66 18 0 0 1 200 130 M193 122 L200 130 L190 133" />
      <text class="rp-tag" x="160" y="92" text-anchor="middle">jednom nogom</text>
    }

    @case ('hoop-pass') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="40" [y]="140" [scale]="0.7" team="us" [rightArm]="[27, 12]" />
      <g appRuleFigure [x]="93" [y]="140" [scale]="0.7" team="us" [leftArm]="[-27, 12]" [rightArm]="[27, 12]" />
      <g appRuleFigure [x]="146" [y]="140" [scale]="0.7" team="us" [leftArm]="[-27, 12]" [rightArm]="[27, 12]" />
      <g appRuleFigure [x]="199" [y]="140" [scale]="0.7" team="us" [leftArm]="[-27, 12]" />
      <ellipse class="rp-pr-hoop" cx="93" cy="100" rx="24" ry="34" />
      <path class="rp-arrow-ok" d="M120 60 H150 m-8 -8 l8 8 l-8 8" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">ruke se ne puštaju</text>
    }

    @case ('hoop-floor-hit') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="1" team="us" legs="wide" [rightArm]="[31, 29]" />
      <circle class="rp-pr-hoop" cx="152" cy="114" r="26" />
      <path class="rp-impact" d="M140 146 l-8 6 M152 148 v8 M164 146 l8 6" />
      <text class="rp-tag" x="120" y="28" text-anchor="middle">udara o pod</text>
    }

    @case ('hoop-space') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="55" [y]="140" [scale]="0.8" team="us" [leftArm]="[-5, -34]" [rightArm]="[5, -34]" leftHand="none" rightHand="none" />
      <ellipse class="rp-pr-hoop" cx="55" cy="53" rx="26" ry="6" />
      <g appRuleFigure [x]="185" [y]="140" [scale]="0.8" team="them" [leftArm]="[-5, -34]" [rightArm]="[5, -34]" leftHand="none" rightHand="none" />
      <ellipse class="rp-pr-hoop" cx="185" cy="53" rx="26" ry="6" />
      <g class="rp-measure">
        <line x1="84" y1="104" x2="156" y2="104" />
        <path d="M90 99 L84 104 L90 109 M150 99 L156 104 L150 109" />
      </g>
      <text class="rp-tag rp-tag-ok" x="120" y="94" text-anchor="middle">oko 2 m</text>
      <text class="rp-tag" x="120" y="154" text-anchor="middle">ritmika: 3 m</text>
    }

    @case ('ball-palm') {
      <ellipse class="rp-hand-big" cx="120" cy="124" rx="54" ry="14" />
      <ellipse class="rp-hand-big" cx="70" cy="114" rx="10" ry="6" transform="rotate(-30 70 114)" />
      <use href="#rp-pr-ball" transform="translate(120 84) scale(5)" />
      <text class="rp-tag rp-tag-ok" x="120" y="154" text-anchor="middle">leži na dlanu</text>
    }

    @case ('ball-squeeze') {
      <use href="#rp-pr-ball" transform="translate(120 90) scale(5)" />
      <ellipse class="rp-hand-big" cx="120" cy="46" rx="36" ry="12" />
      <path class="rp-pr-claw" d="M88 50 Q76 72 86 94 M102 54 Q94 74 100 92 M138 54 Q146 74 140 92 M152 50 Q164 72 154 94" />
      <text class="rp-tag" x="120" y="150" text-anchor="middle">steže prstima</text>
    }

    @case ('ball-catch') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" [leftArm]="[-2, -16]" [rightArm]="[2, -16]" />
      <path class="rp-dash" d="M190 64 Q150 10 112 30" />
      <use href="#rp-pr-ball" transform="translate(100 36) scale(1.6)" />
      <path class="rp-arrow-ok" d="M140 64 V92 m-8 -8 l8 8 l8 -8" />
      <text class="rp-tag" x="180" y="122" text-anchor="middle">ruka se savija</text>
    }

    @case ('ball-bounce') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" [rightArm]="[14, 26]" />
      <use href="#rp-pr-ball" transform="translate(128 128) scale(1.6)" />
      <path class="rp-arrow-ok" d="M156 92 V124 m-7 -7 l7 7 l7 -7" />
      <text class="rp-tag" x="120" y="28" text-anchor="middle">guraj ka podu</text>
    }

    @case ('ball-toss') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" [leftArm]="[-5, -34]" [rightArm]="[5, -34]" />
      <g class="rp-anim-cheer">
        <use href="#rp-pr-ball" transform="translate(120 14) scale(1.4)" />
      </g>
      <path class="rp-pr-turn" d="M152 60 V22 M146 29 L152 22 L158 29" />
      <text class="rp-tag rp-tag-ok" x="120" y="154" text-anchor="middle">samo iznad sebe</text>
    }

    @case ('ball-side-bend') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g class="rp-figure rp-figure-us" transform="translate(120 140)">
        <g class="rp-legs">
          <polyline points="-6,-40 -16,0" />
          <polyline points="6,-40 16,0" />
        </g>
        <g transform="rotate(-16 0 -40)">
          <path class="rp-torso" d="M-12 -76 Q0 -81 12 -76 L10 -40 Q0 -36 -10 -40 Z" />
          <g class="rp-arm">
            <line x1="-11" y1="-74" x2="-4" y2="-110" />
            <line x1="11" y1="-74" x2="4" y2="-110" />
          </g>
          <circle class="rp-head" cx="0" cy="-89" r="9" />
          <use href="#rp-pr-ball" transform="translate(0 -118) scale(1.5)" />
        </g>
      </g>
      <path class="rp-pr-turn" d="M150 44 Q176 70 168 104 M162 98 L168 104 L173 96" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">otklon sa zibom</text>
    }

    @case ('ball-roll-around') {
      <rect class="rp-floor" x="0" y="120" width="240" height="40" />
      <ellipse class="rp-dash" cx="120" cy="136" rx="64" ry="12" />
      <g class="rp-figure rp-figure-us" transform="translate(120 140)">
        <g class="rp-legs">
          <polyline points="-6,-14 -26,-6 8,-2" />
          <polyline points="6,-14 26,-6 -8,-2" />
        </g>
        <g transform="translate(0 26)">
          <path class="rp-torso" d="M-12 -76 Q0 -81 12 -76 L10 -40 Q0 -36 -10 -40 Z" />
          <g class="rp-arm">
            <line x1="-11" y1="-74" x2="-30" y2="-44" />
            <line x1="11" y1="-74" x2="30" y2="-44" />
          </g>
          <circle class="rp-head" cx="0" cy="-89" r="9" />
        </g>
      </g>
      <use href="#rp-pr-ball" transform="translate(184 134) scale(1.4)" />
      <text class="rp-tag" x="120" y="44" text-anchor="middle">turski sed</text>
    }

    @case ('ball-hop') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <use href="#rp-pr-ball" transform="translate(122 130) scale(1.5)" />
      <g appRuleFigure [x]="84" [y]="134" [scale]="1" team="us" legs="jump" leftHand="none" rightHand="none" />
      <g class="rp-pr-ghost">
        <g appRuleFigure [x]="160" [y]="134" [scale]="1" team="us" legs="jump" leftHand="none" rightHand="none" />
      </g>
      <path class="rp-pr-turn" d="M96 36 Q122 12 150 36 M143 30 L150 36 L150 27" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">bočni preskok</text>
    }

    @case ('ball-deep-squat') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g class="rp-figure rp-figure-us" transform="translate(120 140)">
        <g class="rp-legs">
          <polyline points="-6,-18 -24,-30 -10,0" />
          <polyline points="6,-18 24,-30 10,0" />
        </g>
        <g transform="translate(0 22)">
          <path class="rp-torso" d="M-12 -76 Q0 -81 12 -76 L10 -40 Q0 -36 -10 -40 Z" />
          <g class="rp-arm">
            <line x1="-11" y1="-74" x2="-4" y2="-108" />
            <line x1="11" y1="-74" x2="4" y2="-108" />
          </g>
          <circle class="rp-head" cx="0" cy="-89" r="9" />
          <use href="#rp-pr-ball" transform="translate(0 -116) scale(1.5)" />
        </g>
      </g>
      <circle class="rp-highlight" cx="96" cy="110" r="10" />
      <circle class="rp-highlight" cx="144" cy="110" r="10" />
      <text class="rp-tag" x="120" y="154" text-anchor="middle">preduboko</text>
    }

    @case ('med-weight') {
      <use href="#rp-pr-med" transform="translate(75 92) scale(3.6)" />
      <use href="#rp-pr-med" transform="translate(170 86) scale(4.6)" />
      <text class="rp-tag" x="75" y="142" text-anchor="middle">1 kg</text>
      <text class="rp-tag" x="170" y="142" text-anchor="middle">2 kg</text>
      <text class="rp-tag rp-tag-ok" x="120" y="28" text-anchor="middle">mlađi: lakša</text>
    }

    @case ('med-squat-press') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g class="rp-figure rp-figure-us" transform="translate(70 140)">
        <g class="rp-legs">
          <polyline points="-6,-24 -20,-24 -12,0" />
          <polyline points="6,-24 20,-24 12,0" />
        </g>
        <g transform="translate(0 16)">
          <path class="rp-torso" d="M-12 -76 Q0 -81 12 -76 L10 -40 Q0 -36 -10 -40 Z" />
          <g class="rp-arm">
            <line x1="-11" y1="-74" x2="-6" y2="-58" />
            <line x1="11" y1="-74" x2="6" y2="-58" />
          </g>
          <circle class="rp-head" cx="0" cy="-89" r="9" />
          <use href="#rp-pr-med" transform="translate(0 -58) scale(1.6)" />
        </g>
      </g>
      <path class="rp-arrow-ok" d="M104 90 H136 m-9 -9 l9 9 l-9 9" />
      <g appRuleFigure [x]="175" [y]="140" [scale]="1" team="us" [leftArm]="[-5, -34]" [rightArm]="[5, -34]" leftHand="none" rightHand="none" />
      <use href="#rp-pr-med" transform="translate(175 24) scale(1.6)" />
      <text class="rp-tag" x="70" y="154" text-anchor="middle">do paralele</text>
      <text class="rp-tag" x="175" y="154" text-anchor="middle">iznad glave</text>
    }

    @case ('med-throw') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="45" [y]="140" [scale]="0.85" team="us" [leftArm]="[-5, -34]" [rightArm]="[5, -34]" leftHand="none" rightHand="none" />
      <use href="#rp-pr-med" transform="translate(45 42) scale(1.4)" />
      <g appRuleFigure [x]="195" [y]="140" [scale]="0.85" team="them" [leftArm]="[-8, -20]" [rightArm]="[8, -20]" />
      <path class="rp-dash" d="M56 34 Q120 -10 184 52" />
      <g class="rp-measure">
        <line x1="70" y1="122" x2="170" y2="122" />
        <path d="M76 117 L70 122 L76 127 M164 117 L170 122 L164 127" />
      </g>
      <text class="rp-tag" x="120" y="112" text-anchor="middle">4–6 m</text>
    }

    @case ('med-round-back') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <path class="rp-pr-leg" d="M98 140 L106 100 M114 140 L106 100" />
      <path class="rp-pr-body" d="M106 100 Q132 62 158 84" />
