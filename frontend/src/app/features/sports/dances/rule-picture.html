<svg viewBox="0 0 240 160" role="img" [attr.aria-label]="label()">
  @switch (name()) {
    @case ('beat-24') {
      <text class="rp-big" x="58" y="96" text-anchor="middle">2/4</text>
      <g class="rp-anim-glow">
        <circle class="rp-da-beat rp-da-beat-on" cx="132" cy="82" r="20" />
      </g>
      <text class="rp-da-beat-text rp-da-beat-text-on" x="132" y="88" text-anchor="middle">1</text>
      <circle class="rp-da-beat" cx="184" cy="82" r="13" />
      <text class="rp-da-beat-text" x="184" y="88" text-anchor="middle">2</text>
      <text class="rp-tag" x="158" y="134" text-anchor="middle">jedan – dva</text>
    }

    @case ('beat-34') {
      <text class="rp-big" x="48" y="96" text-anchor="middle">3/4</text>
      <g class="rp-anim-glow">
        <circle class="rp-da-beat rp-da-beat-on" cx="112" cy="82" r="20" />
      </g>
      <text class="rp-da-beat-text rp-da-beat-text-on" x="112" y="88" text-anchor="middle">1</text>
      <circle class="rp-da-beat" cx="158" cy="82" r="13" />
      <text class="rp-da-beat-text" x="158" y="88" text-anchor="middle">2</text>
      <circle class="rp-da-beat" cx="196" cy="82" r="13" />
      <text class="rp-da-beat-text" x="196" y="88" text-anchor="middle">3</text>
      <text class="rp-tag" x="150" y="134" text-anchor="middle">jedan – dva – tri</text>
    }

    @case ('tempo-change') {
      <rect class="rp-floor" x="0" y="112" width="240" height="48" />
      <g appRuleFigure [x]="45" [y]="112" [scale]="0.55" team="us" />
      <g appRuleFigure [x]="120" [y]="112" [scale]="0.55" team="us" legs="run" />
      <g appRuleFigure [x]="195" [y]="112" [scale]="0.55" team="us" />
      <text class="rp-tag" x="45" y="132" text-anchor="middle">hod</text>
      <text class="rp-tag" x="120" y="132" text-anchor="middle">trčanje</text>
      <text class="rp-tag" x="195" y="132" text-anchor="middle">sporo</text>
      <text class="rp-da-small" x="45" y="150" text-anchor="middle">1 korak : 1 doba</text>
      <text class="rp-da-small" x="120" y="150" text-anchor="middle">2 koraka : 1 doba</text>
      <text class="rp-da-small" x="195" y="150" text-anchor="middle">1 korak : 2 dobe</text>
    }

    @case ('clap-echo') {
      <rect class="rp-floor" x="0" y="135" width="240" height="25" />
      <g appRuleFigure [x]="70" [y]="135" [scale]="0.85" team="us" [leftArm]="[11, 12]" [rightArm]="[-11, 12]" />
      <path class="rp-impact" d="M58 70 l-8 -6 M58 80 h-10 M82 70 l8 -6 M82 80 h10" />
      <g appRuleFigure [x]="170" [y]="135" [scale]="0.85" team="them" legs="wide" />
      <path class="rp-impact" d="M148 140 l-8 6 M192 140 l8 6 M152 132 l-8 -4 M188 132 l8 -4" />
      <path class="rp-arrow-ok rp-anim-push" d="M102 56 H136 m-9 -9 l9 9 l-9 9" />
      <text class="rp-tag" x="70" y="154" text-anchor="middle">pljesak</text>
      <text class="rp-tag" x="170" y="156" text-anchor="middle">topot</text>
    }

    @case ('kolo-open') {
      <rect class="rp-floor" x="0" y="128" width="240" height="32" />
      @for (x of koloLine; track x; let first = $first; let last = $last) {
        <g
          appRuleFigure
          [x]="x"
          [y]="128"
          [scale]="0.55"
          team="us"
          [leftArm]="first ? [-4, 30] : [-25, 34]"
          [rightArm]="last ? [4, 30] : [25, 34]"
        />
      }
      <text class="rp-tag" x="196" y="62" text-anchor="middle">kolovođa</text>
      <path class="rp-arrow-ok rp-anim-push" d="M60 147 H186 m-9 -8 l9 8 l-9 8" />
      <text class="rp-tag" x="120" y="40" text-anchor="middle">udesno →</text>
    }

    @case ('kolo-closed') {
      <ellipse class="rp-da-arms" cx="120" cy="84" rx="52" ry="40" />
      @for (spot of koloRing; track $index) {
        <circle class="rp-da-head" [attr.cx]="spot.x" [attr.cy]="spot.y" r="8" />
      }
      <text class="rp-da-small" x="120" y="88" text-anchor="middle">centar</text>
      <path class="rp-dash" d="M182 102 A66 54 0 0 0 153 37" />
      <path class="rp-arrow-ok" d="M157 45 L153 37 L162 35" />
      <text class="rp-tag" x="120" y="150" text-anchor="middle">suprotno kazaljci na satu</text>
    }

    @case ('hold-v') {
      <rect class="rp-floor" x="0" y="145" width="240" height="15" />
      <g appRuleFigure [x]="70" [y]="145" [scale]="0.85" team="us" [leftArm]="[-4, 30]" [rightArm]="[18, 34]" />
      <g appRuleFigure [x]="120" [y]="145" [scale]="0.85" team="us" [leftArm]="[-18, 34]" [rightArm]="[18, 34]" />
      <g appRuleFigure [x]="170" [y]="145" [scale]="0.85" team="us" [leftArm]="[-18, 34]" [rightArm]="[4, 30]" />
      <text class="rp-big" x="120" y="40" text-anchor="middle">V</text>
    }

    @case ('hold-t') {
      <rect class="rp-floor" x="0" y="145" width="240" height="15" />
      <g appRuleFigure [x]="70" [y]="145" [scale]="0.85" team="us" [leftArm]="[-4, 30]" [rightArm]="[37, 0]" />
      <g appRuleFigure [x]="120" [y]="145" [scale]="0.85" team="us" [leftArm]="[-37, 0]" [rightArm]="[37, 0]" />
      <g appRuleFigure [x]="170" [y]="145" [scale]="0.85" team="us" [leftArm]="[-37, 0]" [rightArm]="[4, 30]" />
      <text class="rp-big" x="120" y="40" text-anchor="middle">T</text>
    }

    @case ('origin-unesco') {
      <text class="rp-tag" x="120" y="40" text-anchor="middle">UNESCO</text>
      <text class="rp-big" x="120" y="82" text-anchor="middle">2017</text>
      <text class="rp-da-small" x="120" y="102" text-anchor="middle">nematerijalno kulturno nasleđe</text>
      <line class="rp-da-arms" x1="60" y1="140" x2="180" y2="140" />
      @for (x of [60, 90, 120, 150, 180]; track x) {
        <g appRuleFigure [x]="x" [y]="152" [scale]="0.3" team="us" [leftArm]="[-6, 34]" [rightArm]="[6, 34]" />
      }
    }

    @case ('step-walk') {
      <use href="#rp-da-foot-r" transform="translate(132 122)" />
      <text class="rp-step-no rp-da-num-r" x="148" y="126">1</text>
      <use href="#rp-da-foot-l" transform="translate(108 98)" />
      <text class="rp-step-no rp-da-num-l" x="88" y="102">2</text>
      <use href="#rp-da-foot-r" transform="translate(132 74)" />
      <text class="rp-step-no rp-da-num-r" x="148" y="78">1</text>
      <use href="#rp-da-foot-l" transform="translate(108 50)" />
      <text class="rp-step-no rp-da-num-l" x="88" y="54">2</text>
      <path class="rp-arrow-ok" d="M180 120 V56 m-8 9 l8 -9 l8 9" />
      <g class="rp-da-legend">
        <use href="#rp-da-foot-r" transform="translate(18 150) scale(0.55)" />
        <text class="rp-da-small" x="26" y="154">desna</text>
        <use href="#rp-da-foot-l" transform="translate(70 150) scale(0.55)" />
        <text class="rp-da-small" x="78" y="154">leva</text>
      </g>
    }

    @case ('step-close') {
      <use class="rp-da-ghost" href="#rp-da-foot-l" transform="translate(80 96)" />
      <use class="rp-da-ghost" href="#rp-da-foot-r" transform="translate(94 96)" />
      <path class="rp-dash" d="M98 70 Q124 56 148 70" />
      <use href="#rp-da-foot-r" transform="translate(152 96)" />
      <text class="rp-step-no rp-da-num-r" x="166" y="100">1</text>
      <path class="rp-dash" d="M84 122 Q110 134 134 122" />
      <use href="#rp-da-foot-l" transform="translate(138 96)" />
      <text class="rp-step-no rp-da-num-l" x="138" y="124" text-anchor="middle">2</text>
      <text class="rp-tag" x="120" y="44" text-anchor="middle">udesno →</text>
      <g class="rp-da-legend">
        <use href="#rp-da-foot-r" transform="translate(18 150) scale(0.55)" />
        <text class="rp-da-small" x="26" y="154">desna</text>
        <use href="#rp-da-foot-l" transform="translate(70 150) scale(0.55)" />
        <text class="rp-da-small" x="78" y="154">leva</text>
      </g>
    }

    @case ('step-cross') {
      <line class="rp-dash" x1="56" y1="92" x2="196" y2="92" />
      <text class="rp-da-small" x="120" y="40" text-anchor="middle">↑ centar kola</text>
      <use href="#rp-da-foot-r" transform="translate(84 94)" />
      <text class="rp-step-no rp-da-num-r" x="84" y="122" text-anchor="middle">1</text>
      <use href="#rp-da-foot-l" transform="translate(108 74)" />
      <text class="rp-step-no rp-da-num-l" x="108" y="54" text-anchor="middle">2</text>
      <use href="#rp-da-foot-r" transform="translate(132 94)" />
      <text class="rp-step-no rp-da-num-r" x="132" y="122" text-anchor="middle">3</text>
      <use href="#rp-da-foot-l" transform="translate(156 112)" />
      <text class="rp-step-no rp-da-num-l" x="172" y="120">4</text>
      <text class="rp-da-small" x="52" y="70" text-anchor="end">ispred</text>
      <text class="rp-da-small" x="52" y="118" text-anchor="end">iza</text>
      <g class="rp-da-legend">
        <use href="#rp-da-foot-r" transform="translate(18 150) scale(0.55)" />
        <text class="rp-da-small" x="26" y="154">desna</text>
        <use href="#rp-da-foot-l" transform="translate(70 150) scale(0.55)" />
        <text class="rp-da-small" x="78" y="154">leva</text>
      </g>
    }

    @case ('step-hop') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="60" [y]="140" [scale]="0.65" team="us" legs="run" />
      <path class="rp-dash" d="M84 92 Q118 50 146 84" />
      <ellipse class="rp-da-shadow" cx="160" cy="143" rx="14" ry="3" />
      <g class="rp-anim-cheer">
        <g appRuleFigure [x]="160" [y]="124" [scale]="0.75" team="us" legs="jump" [leftArm]="[-14, 16]" [rightArm]="[14, 16]" />
      </g>
      <text class="rp-tag" x="60" y="156" text-anchor="middle">korak</text>
      <text class="rp-tag" x="120" y="40" text-anchor="middle">„pr-va”, „dru-ga”</text>
      <text class="rp-tag" x="198" y="112" text-anchor="middle">poskok</text>
    }

    @case ('trokorak') {
      <g class="rp-step rp-step-1"><use href="#rp-da-foot-r" transform="translate(70 82)" /></g>
      <g class="rp-step rp-step-2"><use href="#rp-da-foot-l" transform="translate(120 82)" /></g>
      <g class="rp-step rp-step-3"><use href="#rp-da-foot-r" transform="translate(156 82)" /></g>
      <text class="rp-step-no rp-da-num-r" x="70" y="56" text-anchor="middle">1</text>
      <text class="rp-step-no rp-da-num-l" x="120" y="56" text-anchor="middle">2</text>
      <text class="rp-step-no rp-da-num-r" x="156" y="56" text-anchor="middle">i</text>
      <rect class="rp-da-block" x="40" y="104" width="62" height="20" rx="4" />
      <rect class="rp-da-block rp-da-block-q" x="106" y="104" width="28" height="20" rx="4" />
      <rect class="rp-da-block rp-da-block-q" x="138" y="104" width="28" height="20" rx="4" />
      <text class="rp-tag-light" x="71" y="118" text-anchor="middle">ta</text>
      <text class="rp-tag-light" x="120" y="118" text-anchor="middle">ti</text>
      <text class="rp-tag-light" x="152" y="118" text-anchor="middle">ti</text>
      <g class="rp-da-legend">
        <use href="#rp-da-foot-r" transform="translate(18 150) scale(0.55)" />
        <text class="rp-da-small" x="26" y="154">desna</text>
        <use href="#rp-da-foot-l" transform="translate(70 150) scale(0.55)" />
        <text class="rp-da-small" x="78" y="154">leva</text>
      </g>
    }

    @case ('trokorak-left') {
      <g class="rp-step rp-step-1"><use href="#rp-da-foot-l" transform="translate(70 82)" /></g>
      <g class="rp-step rp-step-2"><use href="#rp-da-foot-r" transform="translate(120 82)" /></g>
      <g class="rp-step rp-step-3"><use href="#rp-da-foot-l" transform="translate(156 82)" /></g>
      <text class="rp-step-no rp-da-num-l" x="70" y="56" text-anchor="middle">1</text>
      <text class="rp-step-no rp-da-num-r" x="120" y="56" text-anchor="middle">2</text>
      <text class="rp-step-no rp-da-num-l" x="156" y="56" text-anchor="middle">i</text>
      <rect class="rp-da-block" x="40" y="104" width="62" height="20" rx="4" />
      <rect class="rp-da-block rp-da-block-q" x="106" y="104" width="28" height="20" rx="4" />
      <rect class="rp-da-block rp-da-block-q" x="138" y="104" width="28" height="20" rx="4" />
      <text class="rp-tag-light" x="71" y="118" text-anchor="middle">ta</text>
      <text class="rp-tag-light" x="120" y="118" text-anchor="middle">ti</text>
      <text class="rp-tag-light" x="152" y="118" text-anchor="middle">ti</text>
      <g class="rp-da-legend">
        <use href="#rp-da-foot-r" transform="translate(18 150) scale(0.55)" />
        <text class="rp-da-small" x="26" y="154">desna</text>
        <use href="#rp-da-foot-l" transform="translate(70 150) scale(0.55)" />
        <text class="rp-da-small" x="78" y="154">leva</text>
      </g>
    }

    @case ('semicircle') {
      <circle class="rp-da-head rp-da-head-ref" cx="120" cy="50" r="10" />
      <text class="rp-tag" x="120" y="34" text-anchor="middle">nastavnik</text>
      @for (spot of [[58, 82], [72, 104], [94, 120], [120, 126], [146, 120], [168, 104], [182, 82]]; track $index) {
        <circle class="rp-da-head" [attr.cx]="spot[0]" [attr.cy]="spot[1]" r="8" />
      }
      <text class="rp-tag" x="120" y="152" text-anchor="middle">polukrug, bez držanja</text>
    }

    @case ('origin-moravac') {
      <use href="#rp-da-note" transform="translate(52 96) scale(1.6)" />
      <text class="rp-tag" x="140" y="50" text-anchor="middle">Moravac</text>
      <text class="rp-big" x="140" y="92" text-anchor="middle">2/4</text>
      <text class="rp-tag" x="140" y="118" text-anchor="middle">kolo „u šest”, Šumadija</text>
      <text class="rp-da-small" x="140" y="142" text-anchor="middle">4 takta udesno + 4 takta ulevo</text>
    }

    @case ('moravac-seven') {
      <use href="#rp-da-foot-r" transform="translate(30 72)" />
      <text class="rp-step-no rp-da-num-r" x="30" y="50" text-anchor="middle">1</text>
      <use href="#rp-da-foot-l" transform="translate(50 100)" />
      <text class="rp-step-no rp-da-num-l" x="50" y="126" text-anchor="middle">2</text>
      <use href="#rp-da-foot-r" transform="translate(70 72)" />
      <text class="rp-step-no rp-da-num-r" x="70" y="50" text-anchor="middle">3</text>
      <use href="#rp-da-foot-l" transform="translate(90 100)" />
      <text class="rp-step-no rp-da-num-l" x="90" y="126" text-anchor="middle">4</text>
      <use href="#rp-da-foot-r" transform="translate(110 72)" />
      <text class="rp-step-no rp-da-num-r" x="110" y="50" text-anchor="middle">5</text>
      <use href="#rp-da-foot-l" transform="translate(130 100)" />
      <text class="rp-step-no rp-da-num-l" x="130" y="126" text-anchor="middle">6</text>
      <use href="#rp-da-foot-r" transform="translate(150 72)" />
      <text class="rp-step-no rp-da-num-r" x="150" y="50" text-anchor="middle">7</text>
      <path class="rp-arrow-ok rp-anim-push" d="M168 88 H212 m-8 -8 l8 8 l-8 8" />
      <text class="rp-tag" x="196" y="154" text-anchor="middle">takt 1–2</text>
      <g class="rp-da-legend">
        <use href="#rp-da-foot-r" transform="translate(18 150) scale(0.55)" />
        <text class="rp-da-small" x="26" y="154">desna</text>
        <use href="#rp-da-foot-l" transform="translate(70 150) scale(0.55)" />
        <text class="rp-da-small" x="78" y="154">leva</text>
      </g>
    }

    @case ('moravac-threes') {
      <use href="#rp-da-foot-l" transform="translate(44 82)" />
      <use href="#rp-da-foot-r" transform="translate(74 82)" />
      <use href="#rp-da-foot-l" transform="translate(94 82)" />
      <text class="rp-step-no rp-da-num-l" x="44" y="56" text-anchor="middle">1</text>
      <text class="rp-step-no rp-da-num-r" x="74" y="56" text-anchor="middle">2</text>
      <text class="rp-step-no rp-da-num-l" x="94" y="56" text-anchor="middle">i</text>
      <use href="#rp-da-foot-r" transform="translate(146 82)" />
      <use href="#rp-da-foot-l" transform="translate(176 82)" />
      <use href="#rp-da-foot-r" transform="translate(196 82)" />
      <text class="rp-step-no rp-da-num-r" x="146" y="56" text-anchor="middle">1</text>
      <text class="rp-step-no rp-da-num-l" x="176" y="56" text-anchor="middle">2</text>
      <text class="rp-step-no rp-da-num-r" x="196" y="56" text-anchor="middle">i</text>
      <rect class="rp-da-block" x="26" y="104" width="36" height="18" rx="4" />
      <rect class="rp-da-block rp-da-block-q" x="66" y="104" width="16" height="18" rx="4" />
      <rect class="rp-da-block rp-da-block-q" x="86" y="104" width="16" height="18" rx="4" />
      <rect class="rp-da-block" x="128" y="104" width="36" height="18" rx="4" />
      <rect class="rp-da-block rp-da-block-q" x="168" y="104" width="16" height="18" rx="4" />
      <rect class="rp-da-block rp-da-block-q" x="188" y="104" width="16" height="18" rx="4" />
      <text class="rp-tag" x="64" y="138" text-anchor="middle">takt 3</text>
      <text class="rp-tag" x="166" y="138" text-anchor="middle">takt 4</text>
      <g class="rp-da-legend">
        <use href="#rp-da-foot-r" transform="translate(18 150) scale(0.55)" />
        <text class="rp-da-small" x="26" y="154">desna</text>
        <use href="#rp-da-foot-l" transform="translate(70 150) scale(0.55)" />
        <text class="rp-da-small" x="78" y="154">leva</text>
      </g>
    }

    @case ('moravac-left') {
      <use href="#rp-da-foot-l" transform="translate(180 76)" />
      <text class="rp-step-no rp-da-num-l" x="180" y="54" text-anchor="middle">1</text>
      <use href="#rp-da-foot-r" transform="translate(160 104)" />
      <text class="rp-step-no rp-da-num-r" x="160" y="130" text-anchor="middle">2</text>
      <use href="#rp-da-foot-l" transform="translate(140 76)" />
      <text class="rp-step-no rp-da-num-l" x="140" y="54" text-anchor="middle">3</text>
      <use href="#rp-da-foot-r" transform="translate(120 104)" />
      <text class="rp-step-no rp-da-num-r" x="120" y="130" text-anchor="middle">4</text>
      <use href="#rp-da-foot-l" transform="translate(100 76)" />
      <text class="rp-step-no rp-da-num-l" x="100" y="54" text-anchor="middle">5</text>
      <use href="#rp-da-foot-r" transform="translate(80 104)" />
      <text class="rp-step-no rp-da-num-r" x="80" y="130" text-anchor="middle">6</text>
      <use href="#rp-da-foot-l" transform="translate(60 76)" />
      <text class="rp-step-no rp-da-num-l" x="60" y="54" text-anchor="middle">7</text>
      <path class="rp-arrow-ok rp-anim-push" d="M46 92 H14 m8 -8 l-8 8 l8 8" />
      <text class="rp-tag" x="196" y="154" text-anchor="middle">takt 5–8</text>
      <g class="rp-da-legend">
        <use href="#rp-da-foot-r" transform="translate(18 150) scale(0.55)" />
        <text class="rp-da-small" x="26" y="154">desna</text>
        <use href="#rp-da-foot-l" transform="translate(70 150) scale(0.55)" />
        <text class="rp-da-small" x="78" y="154">leva</text>
      </g>
    }

    @case ('var-hajde') {
      <use href="#rp-da-foot-r" transform="translate(48 96)" />
      <text class="rp-step-no rp-da-num-r" x="48" y="122" text-anchor="middle">1</text>
      <use href="#rp-da-foot-l" transform="translate(72 74)" />
      <text class="rp-step-no rp-da-num-l" x="72" y="54" text-anchor="middle">2</text>
      <use href="#rp-da-foot-r" transform="translate(132 96)" />
      <text class="rp-step-no rp-da-num-r" x="132" y="122" text-anchor="middle">1</text>
      <circle class="rp-da-heel rp-anim-glow" cx="148" cy="100" r="5" />
      <text class="rp-step-no rp-da-num-l" x="160" y="122" text-anchor="middle">2</text>
      <text class="rp-da-small" x="160" y="70" text-anchor="middle">dodir petom leve</text>
      <text class="rp-tag" x="60" y="140" text-anchor="middle">takt 1</text>
      <text class="rp-tag" x="146" y="140" text-anchor="middle">takt 2</text>
