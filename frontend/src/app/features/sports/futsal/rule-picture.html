<svg viewBox="0 0 240 160" role="img" [attr.aria-label]="label()">
  @switch (name()) {
    @case ('court-full') {
      <rect class="rp-floor" x="20" y="30" width="200" height="100" />
      <path class="rp-paint" [attr.d]="full.leftArea + ' Z'" />
      <path class="rp-paint" [attr.d]="full.rightArea + ' Z'" />
      <g class="rp-lines">
        <rect x="20" y="30" width="200" height="100" />
        <line x1="120" y1="30" x2="120" y2="130" />
        <circle cx="120" cy="80" [attr.r]="full.centreRadius" />
        <path [attr.d]="full.leftArea" />
        <path [attr.d]="full.rightArea" />
      </g>
      <circle class="rp-fs-mark" [attr.cx]="full.leftPenalty" cy="80" r="1.6" />
      <circle class="rp-fs-mark" [attr.cx]="full.rightPenalty" cy="80" r="1.6" />
      <circle class="rp-fs-mark" [attr.cx]="full.leftTen" cy="80" r="1.6" />
      <circle class="rp-fs-mark" [attr.cx]="full.rightTen" cy="80" r="1.6" />
      <line class="rp-fs-post" x1="20" [attr.y1]="full.postTop" x2="20" [attr.y2]="full.postBottom" />
      <line class="rp-fs-post" x1="220" [attr.y1]="full.postTop" x2="220" [attr.y2]="full.postBottom" />
      <use href="#rp-fs-ball" transform="translate(120 80) scale(0.8)" />
      <text class="rp-tag" x="120" y="146" text-anchor="middle">38–42 m</text>
      <text class="rp-tag" x="120" y="22" text-anchor="middle">20–25 m</text>
    }

    @case ('penalty-area') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-fs-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <circle class="rp-fs-mark" [attr.cx]="zoom.penalty" cy="80" r="3" />
      <circle class="rp-fs-mark" [attr.cx]="zoom.ten" cy="80" r="3" />
      <text class="rp-tag" [attr.x]="zoom.penalty - 4" y="70" text-anchor="end">6 m</text>
      <text class="rp-tag" [attr.x]="zoom.ten" y="70" text-anchor="middle">10 m</text>
      <text class="rp-tag" x="45" y="35" text-anchor="middle">prostor</text>
    }

    @case ('goal-size') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <use href="#rp-fs-goal" transform="translate(130 140) scale(3 3)" />
      <g class="rp-measure">
        <line x1="30" y1="20" x2="30" y2="140" />
        <path d="M25 26 L30 20 L35 26 M25 134 L30 140 L35 134" />
      </g>
      <text class="rp-tag" x="18" y="84" text-anchor="middle">2 m</text>
      <text class="rp-tag" x="130" y="156" text-anchor="middle">3 m</text>
    }

    @case ('ball-size') {
      <use href="#rp-fs-ball" transform="translate(70 80) scale(4.4)" />
      <use href="#rp-fs-ball" transform="translate(180 88) scale(3.6)" />
      <text class="rp-tag" x="70" y="145" text-anchor="middle">5 — fudbal</text>
      <text class="rp-tag rp-tag-ok" x="180" y="145" text-anchor="middle">4 — futsal</text>
    }

    @case ('goal-on-line') {
      <rect class="rp-floor" x="0" y="20" width="120" height="120" />
      <rect class="rp-paint" x="120" y="20" width="110" height="120" />
      <line class="rp-fs-line" x1="120" y1="20" x2="120" y2="140" />
      <use href="#rp-fs-ball" transform="translate(124 80) scale(1.8)" />
      <circle class="rp-highlight" cx="124" cy="80" r="17" />
      <text class="rp-tag" x="60" y="40" text-anchor="middle">teren</text>
      <text class="rp-tag" x="175" y="40" text-anchor="middle">gol</text>
    }

    @case ('ball-on-line') {
      <rect class="rp-floor" x="20" y="20" width="150" height="120" />
      <line class="rp-fs-line" x1="170" y1="20" x2="170" y2="140" />
      <use href="#rp-fs-ball" transform="translate(170 80) scale(1.8)" />
      <circle class="rp-fs-ok-ring" cx="170" cy="80" r="17" />
      <text class="rp-tag rp-tag-ok" x="95" y="40" text-anchor="middle">još u igri</text>
    }

    @case ('team-five') {
      <rect class="rp-floor" x="10" y="30" width="220" height="110" rx="3" />
      <line class="rp-lines" x1="120" y1="30" x2="120" y2="140" />
      <line class="rp-fs-post" x1="10" y1="77" x2="10" y2="93" />
      <line class="rp-fs-post" x1="230" y1="77" x2="230" y2="93" />
      <g class="rp-fs-keeper"><g appRuleFigure [x]="24" [y]="100" [scale]="0.36" team="us" /></g>
      @for (pos of [[55, 70], [55, 130], [90, 82], [100, 128]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.36" team="us" />
      }
      <g class="rp-fs-keeper"><g appRuleFigure [x]="216" [y]="100" [scale]="0.36" team="them" /></g>
      @for (pos of [[140, 82], [150, 130], [185, 70], [185, 130]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.36" team="them" />
      }
      <text class="rp-tag" x="65" y="154" text-anchor="middle">4 + golman</text>
      <text class="rp-tag" x="175" y="154" text-anchor="middle">4 + golman</text>
    }

    @case ('team-bench') {
      <rect class="rp-bench" x="20" y="120" width="200" height="12" rx="4" />
      @for (x of [36, 57, 78, 99, 120, 141, 162, 183, 204]; track x) {
        <g appRuleFigure [x]="x" [y]="120" [scale]="0.33" team="us" [leftArm]="[2, 22]" [rightArm]="[-2, 22]" />
      }
      <text class="rp-big" x="120" y="50" text-anchor="middle">9</text>
    }

    @case ('flying-sub') {
      <rect class="rp-floor" x="0" y="0" width="240" height="100" />
      <line class="rp-lines" x1="0" y1="100" x2="240" y2="100" />
      <rect class="rp-fs-sub-zone" x="70" y="96" width="100" height="8" rx="2" />
      <rect class="rp-bench" x="20" y="146" width="200" height="10" rx="4" />
      <g appRuleFigure [x]="90" [y]="86" [scale]="0.42" team="us" legs="run" number="7" />
      <path class="rp-arrow-them" d="M90 108 V132 m-8 -10 l8 10 l8 -10" />
      <g appRuleFigure [x]="150" [y]="144" [scale]="0.35" team="us" legs="run" number="11" />
      <path class="rp-arrow-ok" d="M150 92 V60 m-8 10 l8 -10 l8 10" />
      <text class="rp-tag" x="234" y="90" text-anchor="end">zona izmena</text>
    }

    @case ('kick-in') {
      <rect class="rp-floor" x="0" y="140" width="150" height="20" />
      <rect class="rp-fs-out" x="150" y="140" width="90" height="20" />
      <line class="rp-fs-line" x1="150" y1="140" x2="150" y2="160" />
      <use href="#rp-fs-ball" transform="translate(150 133) scale(1.1)" />
      <g appRuleFigure [x]="178" [y]="140" [scale]="0.9" team="us" legs="run" [flip]="true" [leftArm]="[-20, 8]" [rightArm]="[20, 6]" />
      <g appRuleFigure [x]="70" [y]="140" [scale]="0.75" team="them" />
      <path class="rp-measure" d="M86 112 H140" />
      <text class="rp-tag" x="113" y="106" text-anchor="middle">5 m</text>
      <text class="rp-tag rp-tag-ok" x="60" y="40" text-anchor="middle">aut — nogom!</text>
    }

    @case ('corner') {
      <rect class="rp-floor" x="20" y="30" width="200" height="100" />
      <path class="rp-paint" [attr.d]="full.leftArea + ' Z'" />
      <g class="rp-lines">
        <rect x="20" y="30" width="200" height="100" />
        <path [attr.d]="full.leftArea" />
        <path d="M20 34 A4 4 0 0 0 24 30" />
      </g>
      <line class="rp-fs-post" x1="20" [attr.y1]="full.postTop" x2="20" [attr.y2]="full.postBottom" />
      <use href="#rp-fs-ball" transform="translate(23 33) scale(0.8)" />
      <g appRuleFigure [x]="10" [y]="48" [scale]="0.3" team="us" />
      <path class="rp-arrow-ok" d="M32 38 Q60 60 52 76" />
      @for (pos of [[60, 64], [55, 96]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.32" team="them" />
      }
      <text class="rp-tag" x="140" y="60" text-anchor="middle">korner — 4 s</text>
    }

    @case ('goal-clearance') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-fs-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g class="rp-fs-keeper"><g appRuleFigure [x]="45" [y]="110" [scale]="0.55" team="us" [rightArm]="[8, -28]" /></g>
      <use href="#rp-fs-ball" transform="translate(56 50)" />
      <path class="rp-arrow-ok" d="M66 50 Q140 20 210 60 m-14 -2 l14 2 l-4 -13" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="0.4" team="them" />
    }

    @case ('kick-off') {
      <rect class="rp-floor" x="20" y="30" width="200" height="100" />
      <g class="rp-lines">
        <rect x="20" y="30" width="200" height="100" />
        <line x1="120" y1="30" x2="120" y2="130" />
        <circle cx="120" cy="80" [attr.r]="full.centreRadius" />
        <path [attr.d]="full.leftArea" />
        <path [attr.d]="full.rightArea" />
      </g>
      <use href="#rp-fs-ball" transform="translate(120 80) scale(0.8)" />
      <g appRuleFigure [x]="110" [y]="92" [scale]="0.32" team="us" />
      @for (pos of [[80, 60], [90, 115], [50, 85]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.3" team="us" />
      }
      @for (pos of [[150, 62], [152, 118], [185, 88]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.3" team="them" />
      }
      <text class="rp-tag" x="120" y="146" text-anchor="middle">3 m od lopte</text>
    }

    @case ('four-sec') {
      <g appRuleFigure [x]="60" [y]="150" [scale]="1" team="ref" [rightArm]="[6, -38]" rightHand="none" />
      <g class="rp-figure rp-figure-ref" transform="translate(77 34)">
        <circle class="rp-head" r="4" />
        <path class="rp-fingers" d="M-5 -2 L-7 -11 M-1.6 -3.5 L-2 -13 M1.6 -3.5 L2 -13 M5 -2 L7 -11" />
      </g>
      <rect class="rp-floor" x="110" y="140" width="130" height="20" />
      <g appRuleFigure [x]="175" [y]="140" [scale]="0.75" team="us" />
      <use href="#rp-fs-ball" transform="translate(192 133)" />
      <g class="rp-clock-mini" transform="translate(205 40)">
        <rect x="-18" y="-13" width="36" height="24" rx="5" />
        <text class="rp-count" y="6" text-anchor="middle">4</text>
      </g>
    }

    @case ('keeper-four-sec') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g class="rp-fs-keeper"><g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" [leftArm]="[18, 8]" [rightArm]="[-18, 8]" leftHand="flat" rightHand="flat" /></g>
      <use href="#rp-fs-ball" transform="translate(100 66) scale(1.3)" />
      <g class="rp-clock-mini" transform="translate(190 50)">
        <rect x="-18" y="-13" width="36" height="24" rx="5" />
        <text class="rp-count" y="6" text-anchor="middle">4</text>
      </g>
      <text class="rp-tag" x="190" y="90" text-anchor="middle">svoja polovina</text>
    }

    @case ('keeper-hands') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-fs-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g class="rp-fs-keeper"><g appRuleFigure [x]="45" [y]="110" [scale]="0.6" team="us" [leftArm]="[-12, -24]" [rightArm]="[12, -24]" /></g>
      <use href="#rp-fs-ball" transform="translate(45 36)" />
      <circle class="rp-fs-ok-ring" cx="45" cy="36" r="12" />
      <text class="rp-tag" x="160" y="80" text-anchor="middle">rukama samo ovde</text>
    }

    @case ('back-pass') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-fs-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g appRuleFigure [x]="170" [y]="120" [scale]="0.5" team="us" legs="run" [flip]="true" />
      <path class="rp-dash" d="M160 118 L60 98" />
      <g class="rp-fs-keeper"><g appRuleFigure [x]="48" [y]="110" [scale]="0.55" team="us" [leftArm]="[14, 16]" [rightArm]="[-14, 16]" leftHand="flat" rightHand="flat" /></g>
      <use href="#rp-fs-ball" transform="translate(48 80)" />
      <circle class="rp-highlight" cx="48" cy="80" r="12" />
    }

    @case ('tackle-ok') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="80" [y]="140" [scale]="1" team="us" legs="run" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="1" team="them" legs="run" [flip]="true" />
      <use href="#rp-fs-ball" transform="translate(116 133) scale(1.1)" />
      <path class="rp-dash" d="M124 132 Q160 120 200 134" />
    }

    @case ('foul-push') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="1" team="them" legs="run" [leftArm]="[30, -4]" [rightArm]="[34, 0]" leftHand="flat" rightHand="flat" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="1" team="us" legs="run" />
      <use href="#rp-fs-ball" transform="translate(178 133) scale(1.1)" />
      <path class="rp-impact" d="M134 60 l8 -6 M134 70 l10 0 M134 80 l8 6" />
    }

    @case ('foul-trip') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="80" [y]="140" [scale]="1" team="them" legs="wide" />
      <g transform="translate(150 140) rotate(30)">
        <g appRuleFigure [x]="0" [y]="0" [scale]="1" team="us" legs="run" [leftArm]="[-20, -14]" [rightArm]="[24, -10]" />
      </g>
      <use href="#rp-fs-ball" transform="translate(205 133) scale(1.1)" />
      <path class="rp-impact" d="M100 126 l6 -8 M108 132 l10 -4" />
    }

    @case ('handball') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="110" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[26, -14]" />
      <use href="#rp-fs-ball" transform="translate(152 56) scale(1.2)" />
      <circle class="rp-highlight" cx="148" cy="58" r="14" />
    }

    @case ('fouls-board') {
      @for (n of fouls; track n) {
        <g [attr.transform]="'translate(' + (10 + (n - 1) * 38) + ' 40)'">
          <rect class="rp-foul-box" width="32" height="46" rx="6" />
          <text class="rp-foul-no" x="16" y="31" text-anchor="middle">{{ n }}</text>
        </g>
      }
      <rect class="rp-foul-red rp-anim-glow" x="200" y="40" width="32" height="46" rx="6" />
      <text class="rp-foul-no rp-on-red" x="216" y="71" text-anchor="middle">6</text>
      <text class="rp-tag" x="120" y="120" text-anchor="middle">u poluvremenu</text>
    }

    @case ('dfksaf') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-fs-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g class="rp-fs-keeper"><g appRuleFigure [x]="30" [y]="98" [scale]="0.4" team="them" [leftArm]="[-12, -20]" [rightArm]="[12, -20]" /></g>
      <use href="#rp-fs-ball" [attr.transform]="'translate(' + zoom.ten + ' 80)'" />
      <g appRuleFigure [x]="zoom.ten + 22" [y]="98" [scale]="0.4" team="us" legs="run" [flip]="true" />
      <text class="rp-tag" [attr.x]="zoom.ten" y="122" text-anchor="middle">10 m</text>
      <text class="rp-tag" x="150" y="30" text-anchor="middle">bez živog zida</text>
    }

    @case ('penalty') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-fs-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g class="rp-fs-keeper"><g appRuleFigure [x]="24" [y]="98" [scale]="0.4" team="them" [leftArm]="[-12, -20]" [rightArm]="[12, -20]" /></g>
      <use href="#rp-fs-ball" [attr.transform]="'translate(' + zoom.penalty + ' 80)'" />
      <g appRuleFigure [x]="zoom.penalty + 20" [y]="98" [scale]="0.4" team="us" legs="run" [flip]="true" />
      @for (y of [30, 135]; track y) {
        <g appRuleFigure [x]="160" [y]="y" [scale]="0.3" team="them" />
      }
      <text class="rp-tag" [attr.x]="zoom.penalty" y="122" text-anchor="middle">6 m</text>
    }

    @case ('card-yellow') {
      <g appRuleFigure [x]="110" [y]="152" [scale]="1.1" team="ref" [rightArm]="[8, -38]" />
      <rect class="rp-card-yellow" x="120" y="4" width="22" height="30" rx="3" />
      <text class="rp-tag" x="196" y="90" text-anchor="middle">2 žuta = crveni</text>
    }

    @case ('card-red') {
      <g appRuleFigure [x]="110" [y]="152" [scale]="1.1" team="ref" [rightArm]="[8, -38]" />
      <rect class="rp-card-red" x="120" y="4" width="22" height="30" rx="3" />
    }

    @case ('two-minutes') {
      <rect class="rp-board-bg" x="20" y="40" width="80" height="56" rx="8" />
      <text class="rp-clock-small" x="60" y="76" text-anchor="middle">2'</text>
      <text class="rp-big" x="170" y="80" text-anchor="middle">5 : 4</text>
      <text class="rp-tag" x="120" y="130" text-anchor="middle">ili dok protivnik ne da gol</text>
    }

    @case ('halves') {
      @for (half of [0, 1]; track half) {
        <g [attr.transform]="'translate(' + (20 + half * 140) + ' 40)'">
          <rect class="rp-board-bg" width="60" height="56" rx="8" />
          <text class="rp-clock-small" x="30" y="36" text-anchor="middle">20'</text>
          <text class="rp-tag" x="30" y="76" text-anchor="middle">{{ half + 1 }}. poluvreme</text>
        </g>
      }
      <text class="rp-tag" x="120" y="74" text-anchor="middle">čista igra</text>
    }

    @case ('timeout') {
      <g appRuleFigure [x]="80" [y]="150" [scale]="1.05" team="ref" [leftArm]="[11, -42]" [rightArm]="[-11, -42]" leftHand="none" rightHand="none" />
      <rect class="rp-ref-hand" x="64" y="20" width="32" height="8" rx="4" />
      <rect class="rp-board-bg" x="150" y="40" width="70" height="50" rx="8" />
      <text class="rp-clock-small" x="185" y="73" text-anchor="middle">1'</text>
      <text class="rp-tag" x="185" y="112" text-anchor="middle">1 u poluvremenu</text>
    }

    @case ('no-offside') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-fs-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g appRuleFigure [x]="96" [y]="124" [scale]="0.45" team="us" />
      <circle class="rp-fs-ok-ring" cx="96" cy="104" r="16" />
      <g appRuleFigure [x]="150" [y]="90" [scale]="0.45" team="them" />
      <g appRuleFigure [x]="200" [y]="110" [scale]="0.45" team="us" legs="run" [flip]="true" />
      <use href="#rp-fs-ball" transform="translate(190 106)" />
