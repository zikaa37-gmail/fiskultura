<svg viewBox="0 0 240 160" role="img" [attr.aria-label]="label()">
  @switch (name()) {
    @case ('pair-field') {
      <rect class="rp-floor" x="8" y="44" width="224" height="108" rx="6" />
      <rect class="rp-eg-bound" x="14" y="50" width="212" height="96" rx="4" />
      <g appRuleFigure [x]="46" [y]="96" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="72" [y]="96" [scale]="0.36" team="them" legs="run" />
      <g appRuleFigure [x]="160" [y]="92" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="186" [y]="92" [scale]="0.36" team="them" legs="run" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="126" [y]="140" [scale]="0.36" team="them" legs="run" />
      <text class="rp-tag" x="120" y="34" text-anchor="middle">15 × 15 m</text>
    }

    @case ('pair-chase') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="70" [y]="140" [scale]="0.75" team="them" legs="run" [rightArm]="[24, 0]" />
      <g appRuleFigure [x]="160" [y]="140" [scale]="0.75" team="us" legs="run" [leftArm]="[-20, 10]" />
      <path class="rp-dash" d="M100 64 H140" />
      <path class="rp-arrow-them" d="M60 152 H96 m-8 -6 l8 6 l-8 6" />
      <path class="rp-arrow-ok" d="M150 152 H190 m-8 -6 l8 6 l-8 6" />
      <text class="rp-tag" x="70" y="52" text-anchor="middle">lovac</text>
      <text class="rp-tag" x="160" y="52" text-anchor="middle">begunac</text>
    }

    @case ('swap-roles') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="80" [y]="140" [scale]="0.7" team="them" [rightArm]="[26, -4]" />
      <g appRuleFigure [x]="122" [y]="140" [scale]="0.7" team="us" />
      <path class="rp-impact" d="M104 76 l-4 -8 M112 76 l4 -8" />
      <path class="rp-arrow-ok" d="M70 54 Q100 34 130 54 m-9 -2 l9 2 l-2 -9" />
      <path class="rp-arrow-them" d="M140 148 Q110 160 80 148" />
      <text class="rp-tag rp-tag-ok" x="190" y="96" text-anchor="middle">uloge se</text>
      <text class="rp-tag rp-tag-ok" x="190" y="110" text-anchor="middle">menjaju</text>
    }

    @case ('push-bad') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="88" [y]="140" [scale]="0.7" team="them" legs="run" [leftArm]="[40, 0]" [rightArm]="[26, 0]" leftHand="flat" rightHand="flat" />
      <g appRuleFigure [x]="132" [y]="140" [scale]="0.7" team="us" legs="run" [leftArm]="[-20, -20]" [rightArm]="[22, -20]" />
      <circle class="rp-highlight" cx="118" cy="88" r="16" />
      <path class="rp-impact" d="M138 70 l8 -6 M142 82 l10 0 M138 94 l8 6" />
      <text class="rp-tag" x="120" y="34" text-anchor="middle">guranje</text>
    }

    @case ('walk-easy') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="70" [y]="140" [scale]="0.7" team="us" [leftArm]="[-8, 30]" [rightArm]="[14, 26]" />
      <g appRuleFigure [x]="98" [y]="140" [scale]="0.7" team="us" [leftArm]="[-14, 26]" [rightArm]="[8, 30]" />
      <g appRuleFigure [x]="126" [y]="140" [scale]="0.7" team="us" [leftArm]="[-14, 26]" />
      <path class="rp-arrow-ok" d="M150 110 H200 m-9 -7 l9 7 l-9 7" />
      <text class="rp-tag rp-tag-ok" x="120" y="40" text-anchor="middle">polako, zajedno</text>
    }

    @case ('tag-zone') {
      <rect class="rp-floor" x="8" y="44" width="224" height="108" rx="6" />
      <rect class="rp-eg-bound" x="14" y="50" width="212" height="96" rx="4" />
      <g appRuleFigure [x]="70" [y]="100" [scale]="0.4" team="them" legs="run" />
      <g appRuleFigure [x]="170" [y]="138" [scale]="0.4" team="them" legs="run" />
      <g appRuleFigure [x]="36" [y]="138" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="120" [y]="94" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="196" [y]="96" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="112" [y]="140" [scale]="0.36" team="us" legs="run" />
      <text class="rp-tag" x="120" y="34" text-anchor="middle">lovci — druga boja</text>
    }

    @case ('freeze-stand') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <circle class="rp-eg-frost" cx="120" cy="96" r="54" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="0.8" team="us" legs="wide" [leftArm]="[-30, 0]" [rightArm]="[30, 0]" />
      <path class="rp-eg-snow" d="M58 60 l10 10 M68 60 l-10 10 M178 60 l10 10 M188 60 l-10 10" />
      <text class="rp-tag" x="120" y="34" text-anchor="middle">zaleđen</text>
    }

    @case ('freeze-crawl') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="0.85" team="us" legs="wide" [leftArm]="[-30, 0]" [rightArm]="[30, 0]" />
      <g transform="translate(96 140) rotate(82)">
        <g appRuleFigure [x]="0" [y]="0" [scale]="0.48" team="us" [leftArm]="[-4, -34]" [rightArm]="[4, -34]" />
      </g>
      <path class="rp-arrow-ok" d="M120 156 H190 m-9 -6 l9 6 l-9 6" />
      <circle class="rp-eg-ring-ok" cx="150" cy="128" r="18" />
      <text class="rp-tag rp-tag-ok" x="100" y="40" text-anchor="middle">kroz noge</text>
    }

    @case ('guard-bad') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="0.75" team="us" legs="wide" [leftArm]="[-28, 0]" [rightArm]="[28, 0]" />
      <g appRuleFigure [x]="160" [y]="140" [scale]="0.75" team="them" [leftArm]="[-16, 20]" [rightArm]="[16, 20]" />
      <circle class="rp-highlight" cx="160" cy="100" r="40" />
      <text class="rp-tag" x="120" y="34" text-anchor="middle">„čuva" zaleđenog</text>
    }

    @case ('touch-save') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="140" [y]="140" [scale]="0.75" team="us" legs="wide" [leftArm]="[-28, 0]" [rightArm]="[28, 0]" />
      <g appRuleFigure [x]="66" [y]="140" [scale]="0.75" team="us" legs="run" [rightArm]="[22, -4]" />
      <path class="rp-impact" d="M104 74 l-4 -8 M112 74 l4 -8" />
      <text class="rp-tag rp-tag-ok" x="120" y="34" text-anchor="middle">dodir ruke</text>
    }

    @case ('chain-start') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="96" [y]="140" [scale]="0.6" team="them" [rightArm]="[14, 30]" [leftArm]="[-24, -6]" />
      <g appRuleFigure [x]="126" [y]="140" [scale]="0.6" team="them" [leftArm]="[-14, 30]" [rightArm]="[24, -6]" />
      <g appRuleFigure [x]="200" [y]="140" [scale]="0.5" team="us" legs="run" />
      <g appRuleFigure [x]="30" [y]="140" [scale]="0.5" team="us" legs="run" />
      <text class="rp-tag" x="111" y="56" text-anchor="middle">dva lovca</text>
    }

    @case ('chain-ends') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="64" [y]="140" [scale]="0.5" team="them" [rightArm]="[17, 32]" [leftArm]="[-26, -8]" />
      <g appRuleFigure [x]="92" [y]="140" [scale]="0.5" team="them" [leftArm]="[-17, 32]" [rightArm]="[17, 32]" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="0.5" team="them" [leftArm]="[-17, 32]" [rightArm]="[17, 32]" />
      <g appRuleFigure [x]="148" [y]="140" [scale]="0.5" team="them" [leftArm]="[-17, 32]" [rightArm]="[26, -8]" />
      <circle class="rp-eg-ring-ok" cx="45" cy="99" r="10" />
      <circle class="rp-eg-ring-ok" cx="166" cy="99" r="10" />
      <g appRuleFigure [x]="206" [y]="140" [scale]="0.5" team="us" legs="run" />
      <text class="rp-tag rp-tag-ok" x="106" y="56" text-anchor="middle">hvataju krajnji</text>
    }

    @case ('chain-under') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="96" [y]="140" [scale]="0.6" team="them" [rightArm]="[14, 0]" [leftArm]="[-24, 20]" />
      <g appRuleFigure [x]="126" [y]="140" [scale]="0.6" team="them" [leftArm]="[-14, 0]" [rightArm]="[24, 20]" />
      <path class="rp-arrow-ok" d="M60 130 Q111 70 170 130 m-3 -10 l3 10 l-10 -2" />
      <g appRuleFigure [x]="190" [y]="140" [scale]="0.45" team="us" legs="run" />
      <text class="rp-tag rp-tag-ok" x="111" y="40" text-anchor="middle">ispod ruku — sme</text>
    }

    @case ('chain-break') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="50" [y]="140" [scale]="0.5" team="them" [rightArm]="[17, 32]" />
      <g appRuleFigure [x]="78" [y]="140" [scale]="0.5" team="them" [leftArm]="[-17, 32]" [rightArm]="[22, 20]" />
      <g appRuleFigure [x]="140" [y]="140" [scale]="0.5" team="them" [leftArm]="[-22, 20]" [rightArm]="[17, 32]" />
      <g appRuleFigure [x]="168" [y]="140" [scale]="0.5" team="them" [rightArm]="[26, -8]" [leftArm]="[-17, 32]" />
      <g appRuleFigure [x]="214" [y]="140" [scale]="0.45" team="us" />
      <circle class="rp-highlight" cx="109" cy="106" r="16" />
      <path class="rp-impact" d="M102 92 l-4 -8 M116 92 l4 -8" />
      <text class="rp-tag" x="109" y="40" text-anchor="middle">pukao — ne važi</text>
    }

    @case ('chain-split') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="44" [y]="140" [scale]="0.5" team="them" [rightArm]="[17, 32]" [leftArm]="[-24, -6]" />
      <g appRuleFigure [x]="72" [y]="140" [scale]="0.5" team="them" [leftArm]="[-17, 32]" />
      <g appRuleFigure [x]="168" [y]="140" [scale]="0.5" team="them" [rightArm]="[17, 32]" />
      <g appRuleFigure [x]="196" [y]="140" [scale]="0.5" team="them" [leftArm]="[-17, 32]" [rightArm]="[24, -6]" />
      <path class="rp-arrow-ok" d="M108 110 H86 m8 -7 l-8 7 l8 7 M132 110 H154 m-8 -7 l8 7 l-8 7" />
      <text class="rp-big" x="120" y="60" text-anchor="middle">4 = 2 + 2</text>
    }

    @case ('one-chaser') {
      <rect class="rp-floor" x="8" y="44" width="224" height="108" rx="6" />
      <rect class="rp-eg-bound" x="14" y="50" width="212" height="96" rx="4" />
      <g appRuleFigure [x]="120" [y]="122" [scale]="0.46" team="them" legs="run" [rightArm]="[22, 0]" />
      <g appRuleFigure [x]="40" [y]="100" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="66" [y]="142" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="184" [y]="98" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="200" [y]="142" [scale]="0.36" team="us" legs="run" />
      <text class="rp-tag" x="120" y="34" text-anchor="middle">jedan lovac</text>
    }

    @case ('help-hands') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="56" [y]="140" [scale]="0.7" team="them" legs="run" [rightArm]="[24, 0]" />
      <g appRuleFigure [x]="134" [y]="140" [scale]="0.6" team="us" [rightArm]="[14, 30]" />
      <g appRuleFigure [x]="164" [y]="140" [scale]="0.6" team="us" [leftArm]="[-14, 30]" />
      <ellipse class="rp-eg-ring-ok" cx="149" cy="108" rx="40" ry="46" />
      <text class="rp-tag rp-tag-ok" x="120" y="40" text-anchor="middle">zaštićeni</text>
    }

    @case ('count-three') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="0.6" team="us" [rightArm]="[14, 30]" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="0.6" team="us" [leftArm]="[-14, 30]" />
      <g class="rp-clock-mini" transform="translate(186 96)">
        <rect x="-22" y="-16" width="44" height="30" rx="6" />
        <text class="rp-count" y="6" text-anchor="middle">3 s</text>
      </g>
      <text class="rp-tag" x="186" y="134" text-anchor="middle">pa pusti!</text>
      <text class="rp-tag" x="105" y="40" text-anchor="middle">najviše 3 sekunde</text>
    }

    @case ('help-trio') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="30" [y]="140" [scale]="0.5" team="them" legs="run" />
      <g appRuleFigure [x]="60" [y]="140" [scale]="0.5" team="them" legs="run" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="0.5" team="us" [rightArm]="[17, 32]" />
      <g appRuleFigure [x]="148" [y]="140" [scale]="0.5" team="us" [leftArm]="[-17, 32]" [rightArm]="[17, 32]" />
      <g appRuleFigure [x]="176" [y]="140" [scale]="0.5" team="us" [leftArm]="[-17, 32]" />
      <ellipse class="rp-eg-ring-ok" cx="148" cy="112" rx="50" ry="40" />
      <text class="rp-tag rp-tag-ok" x="120" y="40" text-anchor="middle">samo trojka</text>
    }

    @case ('third-circle') {
      <rect class="rp-floor" x="8" y="40" width="224" height="114" rx="6" />
      @for (spot of pairSpots; track $index) {
        <circle class="rp-eg-dot-us" [attr.cx]="spot.innerX" [attr.cy]="spot.innerY" r="6" />
        <circle class="rp-eg-dot-us" [attr.cx]="spot.outerX" [attr.cy]="spot.outerY" r="6" />
      }
      <circle class="rp-eg-dot-us" cx="120" cy="150" r="6" />
      <circle class="rp-eg-dot-them" cx="84" cy="146" r="6" />
      <path class="rp-dash" d="M92 148 H112" />
      <text class="rp-tag" x="120" y="100" text-anchor="middle">parovi</text>
    }

    @case ('third-stop') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="86" [y]="140" [scale]="0.7" team="us" />
      <g appRuleFigure [x]="112" [y]="140" [scale]="0.7" team="us" />
      <g appRuleFigure [x]="142" [y]="140" [scale]="0.7" team="us" legs="run" />
      <path class="rp-arrow-ok" d="M160 110 H210 m-9 -7 l9 7 l-9 7" />
      <circle class="rp-highlight" cx="142" cy="78" r="12" />
      <text class="rp-tag" x="86" y="56" text-anchor="middle">stao</text>
      <text class="rp-tag rp-tag-ok" x="142" y="50" text-anchor="middle">treći beži!</text>
    }

    @case ('third-long') {
      <rect class="rp-floor" x="8" y="40" width="224" height="114" rx="6" />
      @for (spot of pairSpots; track $index) {
        <circle class="rp-eg-dot-us" [attr.cx]="spot.innerX" [attr.cy]="spot.innerY" r="6" />
        <circle class="rp-eg-dot-us" [attr.cx]="spot.outerX" [attr.cy]="spot.outerY" r="6" />
      }
      <ellipse class="rp-dash" cx="120" cy="96" rx="96" ry="54" />
      <ellipse class="rp-eg-loop-bad" cx="120" cy="96" rx="104" ry="60" />
      <text class="rp-tag" x="120" y="92" text-anchor="middle">najviše</text>
      <text class="rp-tag" x="120" y="106" text-anchor="middle">1 krug</text>
    }

    @case ('hares-cross') {
      <rect class="rp-floor" x="8" y="40" width="224" height="114" rx="6" />
      <circle class="rp-eg-dot-them" cx="50" cy="100" r="8" />
      <circle class="rp-eg-dot-us" cx="170" cy="100" r="8" />
      <circle class="rp-eg-dot-us" cx="110" cy="146" r="8" />
      <path class="rp-dash" d="M62 100 H156" />
      <path class="rp-arrow-ok" d="M110 136 V62 m-7 9 l7 -9 l7 9" />
      <path class="rp-arrow-them" d="M58 92 Q80 60 102 60" />
      <text class="rp-tag" x="50" y="124" text-anchor="middle">lovac</text>
      <text class="rp-tag" x="170" y="124" text-anchor="middle">zec</text>
      <text class="rp-tag rp-tag-ok" x="150" y="68" text-anchor="middle">pretrči!</text>
    }

    @case ('hares-close') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="96" [y]="140" [scale]="0.7" team="them" legs="run" [rightArm]="[22, 0]" />
      <g appRuleFigure [x]="124" [y]="140" [scale]="0.7" team="us" legs="run" />
      <circle class="rp-highlight" cx="110" cy="96" r="34" />
      <path class="rp-impact" d="M150 70 l8 -6 M154 84 l10 0" />
      <text class="rp-tag" x="110" y="40" text-anchor="middle">preblizu!</text>
    }

    @case ('hares-hop') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="36" [y]="140" [scale]="0.55" team="them" legs="run" />
      <g appRuleFigure [x]="70" [y]="140" [scale]="0.55" team="them" legs="run" />
      <g class="rp-anim-cheer">
        <g appRuleFigure [x]="140" [y]="126" [scale]="0.55" team="us" legs="jump" />
        <g appRuleFigure [x]="184" [y]="126" [scale]="0.55" team="us" legs="jump" />
      </g>
      <text class="rp-tag" x="53" y="66" text-anchor="middle">2 lovca</text>
      <text class="rp-tag rp-tag-ok" x="162" y="56" text-anchor="middle">poskoci</text>
    }

    @case ('ballsave-field') {
      <rect class="rp-floor" x="8" y="44" width="224" height="108" rx="6" />
      <rect class="rp-eg-bound" x="14" y="50" width="212" height="96" rx="4" />
      <g appRuleFigure [x]="80" [y]="112" [scale]="0.42" team="them" legs="run" />
      <g appRuleFigure [x]="166" [y]="140" [scale]="0.42" team="them" legs="run" />
      <g appRuleFigure [x]="36" [y]="140" [scale]="0.36" team="us" [rightArm]="[14, 14]" />
      <use href="#rp-eg-ball" transform="translate(45 119) scale(0.7)" />
      <g appRuleFigure [x]="150" [y]="96" [scale]="0.36" team="us" [rightArm]="[14, 14]" />
      <use href="#rp-eg-ball" transform="translate(159 75) scale(0.7)" />
      <g appRuleFigure [x]="112" [y]="142" [scale]="0.36" team="us" legs="run" />
      <g appRuleFigure [x]="206" [y]="100" [scale]="0.36" team="us" legs="run" />
      <text class="rp-tag" x="120" y="34" text-anchor="middle">2–4 lopte</text>
    }

    @case ('ballsave-safe') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="70" [y]="140" [scale]="0.7" team="them" legs="run" [rightArm]="[22, 0]" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="0.7" team="us" [leftArm]="[4, 16]" [rightArm]="[-4, 16]" />
      <use href="#rp-eg-ball" transform="translate(150 98) scale(1.2)" />
      <ellipse class="rp-eg-ring-ok" cx="150" cy="104" rx="34" ry="48" />
      <text class="rp-tag rp-tag-ok" x="120" y="40" text-anchor="middle">sa loptom — zaštićen</text>
    }

    @case ('ballsave-pass') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="40" [y]="140" [scale]="0.6" team="us" [rightArm]="[24, -10]" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="0.6" team="us" [leftArm]="[-22, -6]" />
      <g appRuleFigure [x]="200" [y]="140" [scale]="0.6" team="them" legs="run" [leftArm]="[-22, 0]" />
      <path class="rp-dash" d="M66 88 Q100 60 132 88" />
      <use href="#rp-eg-ball" transform="translate(100 70)" />
      <text class="rp-tag rp-tag-ok" x="100" y="46" text-anchor="middle">dodaj!</text>
    }

    @case ('ballsave-hold') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="0.75" team="us" [leftArm]="[4, 16]" [rightArm]="[-4, 16]" />
      <use href="#rp-eg-ball" transform="translate(90 96) scale(1.2)" />

      <path class="rp-dash" d="M50 80 L84 70 M190 80 L156 64 M124 30 L132 92" />

      <g appRuleFigure [x]="100" [y]="66" [scale]="0.3" team="us" />

      <g appRuleFigure [x]="190" [y]="70" [scale]="0.3" team="them" />
      <g appRuleFigure [x]="150" [y]="126" [scale]="0.3" team="them" />

    @case ('border-save') {

    @case ('border-pass') {
