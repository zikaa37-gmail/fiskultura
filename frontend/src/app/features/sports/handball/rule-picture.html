<svg viewBox="0 0 240 160" role="img" [attr.aria-label]="label()">
  @switch (name()) {
    @case ('court-full') {
      <rect class="rp-floor" x="20" y="30" width="200" height="100" />
      <path class="rp-paint" [attr.d]="full.leftArea + ' Z'" />
      <path class="rp-paint" [attr.d]="full.rightArea + ' Z'" />
      <g class="rp-lines">
        <rect x="20" y="30" width="200" height="100" />
        <line x1="120" y1="30" x2="120" y2="130" />
        <path [attr.d]="full.leftArea" />
        <path [attr.d]="full.rightArea" />
      </g>
      <g clip-path="url(#rp-hb-court-clip)">
        <path class="rp-dash" [attr.d]="full.leftFree" />
        <path class="rp-dash" [attr.d]="full.rightFree" />
      </g>
      <line class="rp-hb-post" x1="20" [attr.y1]="full.postTop" x2="20" [attr.y2]="full.postBottom" />
      <line class="rp-hb-post" x1="220" [attr.y1]="full.postTop" x2="220" [attr.y2]="full.postBottom" />
      <use href="#rp-hb-ball" transform="translate(120 80) scale(0.9)" />
      <text class="rp-tag" x="120" y="146" text-anchor="middle">40 m</text>
      <text class="rp-tag" x="120" y="22" text-anchor="middle">20 m širok</text>
    }

    @case ('court-lines') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
        <line [attr.x1]="zoom.seven" y1="75" [attr.x2]="zoom.seven" y2="85" />
        <line [attr.x1]="zoom.four" y1="77.5" [attr.x2]="zoom.four" y2="82.5" />
      </g>
      <path class="rp-dash" [attr.d]="zoom.free" />
      <line class="rp-hb-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <text class="rp-tag" x="45" y="35" text-anchor="middle">6 m</text>
      <text class="rp-tag" x="130" y="30" text-anchor="middle">9 m</text>
      <text class="rp-tag" [attr.x]="zoom.seven + 6" y="98" text-anchor="start">7 m</text>
      <text class="rp-tag" [attr.x]="zoom.four" y="100" text-anchor="middle">4 m</text>
    }

    @case ('goal-size') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <use href="#rp-hb-goal" transform="translate(130 140) scale(3 3)" />
      <g class="rp-measure">
        <line x1="30" y1="20" x2="30" y2="140" />
        <path d="M25 26 L30 20 L35 26 M25 134 L30 140 L35 134" />
      </g>
      <text class="rp-tag" x="18" y="84" text-anchor="middle">2 m</text>
      <text class="rp-tag" x="130" y="156" text-anchor="middle">3 m</text>
    }

    @case ('goal-in') {
      <rect class="rp-floor" x="0" y="20" width="120" height="120" />
      <rect class="rp-paint" x="120" y="20" width="110" height="120" />
      <line class="rp-hb-goal-line" x1="120" y1="20" x2="120" y2="140" />
      <use href="#rp-hb-ball" transform="translate(150 80) scale(1.8)" />
      <text class="rp-tag" x="60" y="40" text-anchor="middle">teren</text>
      <text class="rp-tag rp-tag-ok" x="175" y="40" text-anchor="middle">gol!</text>
    }

    @case ('goal-on-line') {
      <rect class="rp-floor" x="0" y="20" width="120" height="120" />
      <rect class="rp-paint" x="120" y="20" width="110" height="120" />
      <line class="rp-hb-goal-line" x1="120" y1="20" x2="120" y2="140" />
      <use href="#rp-hb-ball" transform="translate(124 80) scale(1.8)" />
      <circle class="rp-highlight" cx="124" cy="80" r="17" />
      <text class="rp-tag" x="60" y="40" text-anchor="middle">teren</text>
      <text class="rp-tag" x="175" y="40" text-anchor="middle">gol</text>
    }

    @case ('team-seven') {
      <rect class="rp-floor" x="10" y="30" width="220" height="110" rx="3" />
      <line class="rp-lines" x1="120" y1="30" x2="120" y2="140" />
      <line class="rp-hb-post" x1="10" y1="77" x2="10" y2="93" />
      <line class="rp-hb-post" x1="230" y1="77" x2="230" y2="93" />
      <g class="rp-hb-keeper"><g appRuleFigure [x]="22" [y]="100" [scale]="0.36" team="us" /></g>
      @for (pos of [[50, 66], [50, 128], [68, 97], [92, 70], [96, 130], [105, 102]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.36" team="us" />
      }
      <g class="rp-hb-keeper"><g appRuleFigure [x]="218" [y]="100" [scale]="0.36" team="them" /></g>
      @for (pos of [[135, 70], [145, 130], [160, 100], [180, 66], [190, 128], [196, 98]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.36" team="them" />
      }
      <text class="rp-tag" x="65" y="154" text-anchor="middle">6 + golman</text>
      <text class="rp-tag" x="175" y="154" text-anchor="middle">6 + golman</text>
    }

    @case ('team-bench') {
      <rect class="rp-bench" x="6" y="120" width="228" height="12" rx="4" />
      @for (x of [16, 30, 44, 58, 72, 86, 100, 114, 128, 142, 156, 170, 184, 198, 212, 226]; track x) {
        <g appRuleFigure [x]="x" [y]="120" [scale]="0.26" team="us" [leftArm]="[2, 22]" [rightArm]="[-2, 22]" />
      }
      <text class="rp-big" x="120" y="50" text-anchor="middle">16</text>
    }

    @case ('flying-sub') {
      <rect class="rp-floor" x="0" y="0" width="240" height="100" />
      <line class="rp-lines" x1="0" y1="100" x2="240" y2="100" />
      <rect class="rp-hb-sub-zone" x="70" y="96" width="100" height="8" rx="2" />
      <rect class="rp-bench" x="20" y="146" width="200" height="10" rx="4" />
      <g appRuleFigure [x]="90" [y]="86" [scale]="0.42" team="us" legs="run" number="9" />
      <path class="rp-arrow-them" d="M90 108 V132 m-8 -10 l8 10 l8 -10" />
      <g appRuleFigure [x]="150" [y]="144" [scale]="0.35" team="us" legs="run" number="14" />
      <path class="rp-arrow-ok" d="M150 92 V60 m-8 10 l8 -10 l8 10" />
      <text class="rp-tag" x="234" y="90" text-anchor="end">zona izmena</text>
    }

    @case ('area-keeper') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint rp-anim-glow" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-hb-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g class="rp-hb-keeper"><g appRuleFigure [x]="45" [y]="100" [scale]="0.5" team="us" [leftArm]="[-12, -24]" [rightArm]="[12, -24]" /></g>
      <use href="#rp-hb-ball" transform="translate(62 120)" />
      <g appRuleFigure [x]="150" [y]="110" [scale]="0.5" team="them" />
      <text class="rp-tag" x="150" y="140" text-anchor="middle">ostali — napolju</text>
    }

    @case ('area-attacker') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-hb-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g appRuleFigure [x]="78" [y]="118" [scale]="0.6" team="us" legs="run" [leftArm]="[-16, -6]" />
      <use href="#rp-hb-ball" transform="translate(64 69)" />
      <circle class="rp-highlight" cx="72" cy="118" r="12" />
    }

    @case ('area-jump') {
      <rect class="rp-paint" x="0" y="140" width="120" height="20" />
      <rect class="rp-floor" x="120" y="140" width="120" height="20" />
      <line class="rp-lines" x1="120" y1="140" x2="120" y2="160" />
      <text class="rp-tag" x="55" y="132" text-anchor="middle">prostor golmana</text>
      <use href="#rp-hb-foot" class="rp-foot-ok" transform="translate(150 148) rotate(-90)" />
      <path class="rp-dash" d="M150 138 Q125 70 95 138" />
      <g appRuleFigure [x]="122" [y]="112" [scale]="0.75" team="us" legs="jump" [flip]="true" [rightArm]="[14, -30]" />
      <use href="#rp-hb-ball" transform="translate(104 30)" />
      <path class="rp-arrow-ok" d="M92 32 H40 m10 -9 l-10 9 l10 9" />
      <use href="#rp-hb-foot" class="rp-foot" transform="translate(95 148) rotate(-90)" />
    }

    @case ('area-defender') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-hb-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g appRuleFigure [x]="58" [y]="110" [scale]="0.6" team="them" legs="wide" [leftArm]="[-6, -26]" [rightArm]="[16, -20]" />
      <circle class="rp-highlight" cx="58" cy="108" r="13" />
      <g appRuleFigure [x]="120" [y]="110" [scale]="0.6" team="us" legs="jump" [leftArm]="[-14, -26]" />
      <use href="#rp-hb-ball" transform="translate(107 49)" />
    }

    @case ('three-steps') {
      <rect class="rp-floor" x="0" y="100" width="240" height="60" />
      <g class="rp-step rp-step-1"><use href="#rp-hb-foot" transform="translate(50 135) rotate(80)" /><text class="rp-step-no" x="50" y="122" text-anchor="middle">1</text></g>
      <g class="rp-step rp-step-2"><use href="#rp-hb-foot" transform="translate(110 125) rotate(100)" /><text class="rp-step-no" x="110" y="112" text-anchor="middle">2</text></g>
      <g class="rp-step rp-step-3"><use href="#rp-hb-foot" transform="translate(170 135) rotate(80)" /><text class="rp-step-no" x="170" y="122" text-anchor="middle">3</text></g>
      <g appRuleFigure [x]="110" [y]="95" [scale]="0.75" team="us" legs="run" [rightArm]="[14, -26]" />
      <use href="#rp-hb-ball" transform="translate(130 24)" />
      <use href="#rp-hb-goal" transform="translate(212 60) scale(0.7)" />
    }

    @case ('four-steps') {
      <rect class="rp-floor" x="0" y="100" width="240" height="60" />
      @for (step of [[35, 135, 80], [85, 125, 100], [135, 135, 80], [185, 125, 100]]; track $index) {
        <use href="#rp-hb-foot" [class.rp-foot-bad]="$index === 3" [attr.transform]="'translate(' + step[0] + ' ' + step[1] + ') rotate(' + step[2] + ')'" />
        <text class="rp-step-no" [class.rp-hb-bad-no]="$index === 3" [attr.x]="step[0]" [attr.y]="step[1] - 13" text-anchor="middle">{{ $index + 1 }}</text>
      }
      <g appRuleFigure [x]="110" [y]="95" [scale]="0.75" team="us" legs="run" [leftArm]="[18, 10]" [rightArm]="[2, 12]" />
      <use href="#rp-hb-ball" transform="translate(126 32)" />
    }

    @case ('three-sec') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="1" team="us" [leftArm]="[20, 6]" [rightArm]="[-2, 10]" />
      <use href="#rp-hb-ball" transform="translate(78 82) scale(1.2)" />
      <text class="rp-count rp-count-seq" x="180" y="80" text-anchor="middle">
        <tspan class="rp-seq rp-seq-1" x="180">1</tspan>
        <tspan class="rp-seq rp-seq-2" x="180">2</tspan>
        <tspan class="rp-seq rp-seq-3" x="180">3</tspan>
      </text>
    }

    @case ('dribble') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[18, 22]" />
      <g class="rp-anim-bounce"><use href="#rp-hb-ball" transform="translate(132 100) scale(1.2)" /></g>
      <text class="rp-tag" x="200" y="40" text-anchor="middle">3 – vođenje – 3</text>
    }

    @case ('double-dribble') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="100" [y]="140" [scale]="1" team="us" [leftArm]="[18, 8]" [rightArm]="[-18, 8]" leftHand="flat" rightHand="flat" />
      <use href="#rp-hb-ball" transform="translate(100 66) scale(1.3)" />
      <path class="rp-dash" d="M122 76 Q160 90 168 136 Q174 100 188 70" />
      <path class="rp-impact" d="M160 140 l-6 6 M176 140 l6 6" />
      <text class="rp-step-no rp-hb-bad-no" x="196" y="60" text-anchor="middle">2.</text>
    }

    @case ('body-ok') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1.05" team="us" [leftArm]="[-20, -10]" [rightArm]="[20, -10]" />
      <circle class="rp-hb-ok-ring" cx="120" cy="47" r="13" />
      <circle class="rp-hb-ok-ring" cx="120" cy="78" r="15" />
      <circle class="rp-hb-ok-ring" cx="88" cy="52" r="9" />
      <circle class="rp-hb-ok-ring" cx="152" cy="52" r="9" />
      <circle class="rp-hb-ok-ring" cx="114" cy="110" r="9" />
      <text class="rp-tag rp-tag-ok" x="200" y="120" text-anchor="middle">do kolena</text>
    }

    @case ('foot-bad') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="110" [y]="140" [scale]="1" team="us" legs="run" [leftArm]="[-20, 10]" [rightArm]="[22, 4]" />
      <use href="#rp-hb-ball" transform="translate(126 130) scale(1.2)" />
      <circle class="rp-highlight" cx="122" cy="134" r="14" />
    }

    @case ('throw-in') {
      <rect class="rp-floor" x="0" y="20" width="150" height="140" />
      <line class="rp-lines" x1="150" y1="20" x2="150" y2="160" />
      <g appRuleFigure [x]="155" [y]="150" [scale]="1" team="us" [leftArm]="[-6, -30]" [rightArm]="[6, -30]" />
      <use href="#rp-hb-ball" transform="translate(155 40) scale(1.2)" />
      <path class="rp-arrow-ok" d="M135 50 H75 m10 -9 l-10 9 l10 9" />
      <circle class="rp-hb-ok-ring" cx="150" cy="150" r="9" />
      <g appRuleFigure [x]="60" [y]="150" [scale]="0.7" team="them" />
      <path class="rp-measure" d="M75 120 H130" />
      <text class="rp-tag" x="102" y="114" text-anchor="middle">3 m</text>
    }

    @case ('corner-throw') {
      <rect class="rp-floor" x="20" y="30" width="200" height="100" />
      <path class="rp-paint" [attr.d]="full.leftArea + ' Z'" />
      <g class="rp-lines">
        <rect x="20" y="30" width="200" height="100" />
        <line x1="120" y1="30" x2="120" y2="130" />
        <path [attr.d]="full.leftArea" />
      </g>
      <line class="rp-hb-post" x1="20" [attr.y1]="full.postTop" x2="20" [attr.y2]="full.postBottom" />
      <g appRuleFigure [x]="64" [y]="70" [scale]="0.34" team="them" [leftArm]="[-16, -10]" />
      <path class="rp-dash" d="M56 50 L12 46" />
      <use href="#rp-hb-ball" transform="translate(12 46) scale(0.9)" />
      <circle class="rp-hb-ok-ring" cx="20" cy="30" r="9" />
      <path class="rp-arrow-ok" d="M14 38 Q4 30 14 24" />
      <text class="rp-tag" x="80" y="20" text-anchor="middle">aut iz ugla</text>
    }

    @case ('keeper-throw') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <line class="rp-hb-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      <g class="rp-hb-keeper"><g appRuleFigure [x]="45" [y]="110" [scale]="0.55" team="us" [rightArm]="[8, -28]" /></g>
      <use href="#rp-hb-ball" transform="translate(56 50)" />
      <path class="rp-arrow-ok" d="M66 50 Q140 20 210 60 m-14 -2 l14 2 l-4 -13" />
    }

    @case ('throw-off') {
      <rect class="rp-floor" x="20" y="30" width="200" height="100" />
      <g class="rp-lines">
        <rect x="20" y="30" width="200" height="100" />
        <line x1="120" y1="30" x2="120" y2="130" />
        <circle cx="120" cy="80" r="10" />
        <path [attr.d]="full.leftArea" />
        <path [attr.d]="full.rightArea" />
      </g>
      <g appRuleFigure [x]="120" [y]="88" [scale]="0.34" team="us" />
      <use href="#rp-hb-ball" transform="translate(126 68) scale(0.7)" />
      @for (pos of [[150, 60], [160, 110], [185, 85]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.32" team="us" />
      }
      @for (pos of [[70, 62], [80, 112], [92, 88]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.32" team="them" />
      }
      <g class="rp-clock-mini" transform="translate(200 146)">
        <rect x="-18" y="-13" width="36" height="24" rx="5" />
        <text class="rp-count" y="6" text-anchor="middle">3</text>
      </g>
      <text class="rp-tag" x="80" y="150" text-anchor="middle">centar</text>
    }

    @case ('block-ok') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="80" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[20, -24]" />
      <use href="#rp-hb-ball" transform="translate(112 46)" />
      <g appRuleFigure [x]="140" [y]="140" [scale]="1" team="them" legs="wide" [leftArm]="[-18, -2]" [rightArm]="[-8, 8]" />
      <path class="rp-dash" d="M120 50 V130" />
    }

    @case ('foul-push') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="90" [y]="140" [scale]="1" team="them" legs="run" [leftArm]="[30, -4]" [rightArm]="[34, 0]" leftHand="flat" rightHand="flat" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[18, -26]" />
      <use href="#rp-hb-ball" transform="translate(180 42)" />
      <path class="rp-impact" d="M134 60 l8 -6 M134 70 l10 0 M134 80 l8 6" />
    }

    @case ('foul-hold') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="80" [y]="140" [scale]="1" team="them" [rightArm]="[40, 6]" rightHand="fist" />
      <g appRuleFigure [x]="150" [y]="140" [scale]="1" team="us" legs="run" [rightArm]="[20, -24]" />
      <use href="#rp-hb-ball" transform="translate(181 44)" />
    }

    @case ('free-throw') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />
      <path class="rp-paint" [attr.d]="zoom.area + ' Z'" />
      <g class="rp-lines">
        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
      </g>
      <path class="rp-dash" [attr.d]="zoom.free" />
      <line class="rp-hb-post" x1="20" [attr.y1]="zoom.postTop" x2="20" [attr.y2]="zoom.postBottom" />
      @for (y of [54, 88, 122]; track y) {
        <g appRuleFigure [x]="86" [y]="y" [scale]="0.3" team="them" [leftArm]="[-6, -26]" [rightArm]="[6, -26]" />
      }
      <g appRuleFigure [x]="122" [y]="96" [scale]="0.4" team="us" [rightArm]="[8, -28]" />
      <use href="#rp-hb-ball" transform="translate(130 50) scale(0.8)" />
      <text class="rp-tag" x="190" y="150" text-anchor="middle">9 m</text>
    }

    @case ('card-yellow') {
      <g appRuleFigure [x]="110" [y]="152" [scale]="1.1" team="ref" [rightArm]="[8, -38]" />
      <rect class="rp-card-yellow" x="120" y="4" width="22" height="30" rx="3" />
      <text class="rp-tag" x="196" y="80" text-anchor="middle">1 po igraču</text>
      <text class="rp-tag" x="196" y="96" text-anchor="middle">3 po ekipi</text>
    }

    @case ('suspension') {
      <g appRuleFigure [x]="70" [y]="152" [scale]="1.05" team="ref" [rightArm]="[6, -38]" rightHand="none" [leftArm]="[-26, -8]" />
      <g class="rp-figure rp-figure-ref" transform="translate(88 30) scale(1.05)">
        <circle class="rp-head" r="4" />
        <path class="rp-fingers" d="M-2 -3 L-5 -12 M2 -3 L5 -12" />
      </g>
      <rect class="rp-board-bg" x="150" y="40" width="70" height="50" rx="8" />

    @case ('card-blue') {

      <g appRuleFigure [x]="150" [y]="112" [scale]="0.6" team="them" legs="run" [flip]="true" [leftArm]="[34, -6]" leftHand="fist" />

        <line x1="20" y1="0" x2="20" y2="160" />

        <rect x="-18" y="-13" width="36" height="24" rx="5" />

    @case ('seven-keeper') {
      <rect class="rp-floor" x="0" y="0" width="240" height="160" />

        <line x1="20" y1="0" x2="20" y2="160" />
        <path [attr.d]="zoom.area" />
        <line [attr.x1]="zoom.seven" y1="75" [attr.x2]="zoom.seven" y2="85" />

      <line class="rp-hb-four" [attr.x1]="zoom.four" y1="74" [attr.x2]="zoom.four" y2="86" />

      <g appRuleFigure [x]="zoom.seven + 16" [y]="96" [scale]="0.4" team="them" [leftArm]="[-8, -28]" />

    @case ('passive-warning') {
      <g appRuleFigure [x]="80" [y]="152" [scale]="1.1" team="ref" [rightArm]="[4, -40]" rightHand="flat" />

      <text class="rp-tag" x="170" y="100" text-anchor="middle">upozorenje</text>
    }

    @case ('passive-passes') {
      @for (pos of [[20, 120], [70, 60], [120, 120], [170, 60], [220, 120]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.42" team="us" />
      }
      @for (pass of passes; track pass.number) {
        <line class="rp-dash" [attr.x1]="pass.x1" [attr.y1]="pass.y1" [attr.x2]="pass.x2" [attr.y2]="pass.y2" />

    }

    @case ('halves') {
      @for (half of [0, 1]; track half) {
        <g [attr.transform]="'translate(' + (20 + half * 140) + ' 40)'">
          <rect class="rp-board-bg" width="60" height="56" rx="8" />

    @case ('timeout-card') {

      <text class="rp-tag" x="120" y="146" text-anchor="middle">3 po utakmici, do 2 u poluvremenu</text>

      <text class="rp-tag" x="125" y="140" text-anchor="middle">2</text>
      <text class="rp-tag" x="205" y="140" text-anchor="middle">3 — muškarci</text>
    }

    @case ('sig-steps') {
      <g appRuleFigure [x]="120" [y]="152" [scale]="1.15" team="ref" [leftArm]="[14, 8]" [rightArm]="[-14, 8]" leftHand="none" rightHand="none" />

      <g class="rp-anim-pat-b"><rect class="rp-ref-hand" x="130" y="82" width="14" height="7" rx="3.5" /></g>

    @case ('sig-area') {
      <g appRuleFigure [x]="110" [y]="152" [scale]="1.15" team="ref" [rightArm]="[34, -2]" rightHand="flat" />

    @case ('sig-offensive') {

    @case ('sig-passive') {

    @case ('sig-goal') {

    @case ('sig-timeout') {

    }

    @case ('help-up') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />

    @case ('respect-ref') {

    @case ('cheer') {

      }
      <path class="rp-heart" d="M120 52 C96 30 108 12 120 28 C132 12 144 30 120 52 Z" />

  }
