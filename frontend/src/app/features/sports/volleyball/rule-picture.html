<svg viewBox="0 0 240 160" role="img" [attr.aria-label]="label()">
  @switch (name()) {
    @case ('court-full') {
      <rect class="rp-floor" x="28" y="35" width="184" height="92" />
      <g class="rp-lines">
        <rect x="28" y="35" width="184" height="92" />
        <line x1="89.3" y1="35" x2="89.3" y2="127" />
        <line x1="150.7" y1="35" x2="150.7" y2="127" />
      </g>
      <line class="rp-vb-net-top" x1="120" y1="26" x2="120" y2="136" />
      <text class="rp-tag" x="120" y="20" text-anchor="middle">mreža</text>
      <text class="rp-tag" x="120" y="148" text-anchor="middle">18 m</text>
      <text class="rp-tag" x="14" y="85" text-anchor="middle">9 m</text>
      <use href="#rp-vb-ball" transform="translate(180 81) scale(0.9)" />
    }

    @case ('court-zones') {
      <rect class="rp-zone-back" x="28" y="35" width="61.3" height="92" />
      <rect class="rp-zone-front" x="89.3" y="35" width="61.4" height="92" />
      <rect class="rp-zone-back" x="150.7" y="35" width="61.3" height="92" />
      <g class="rp-lines">
        <rect x="28" y="35" width="184" height="92" />
        <line x1="89.3" y1="35" x2="89.3" y2="127" />
        <line x1="150.7" y1="35" x2="150.7" y2="127" />
      </g>
      <line class="rp-vb-net-top" x1="120" y1="26" x2="120" y2="136" />
      <text class="rp-tag" x="58" y="85" text-anchor="middle">zadnja</text>
      <text class="rp-tag" x="182" y="85" text-anchor="middle">zadnja</text>
      <text class="rp-tag" x="105" y="50" text-anchor="middle">3 m</text>
      <text class="rp-tag" x="135" y="50" text-anchor="middle">3 m</text>
      <text class="rp-tag" x="120" y="148" text-anchor="middle">prednja zona</text>
    }

    @case ('net-height') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="60" y1="140" x2="60" y2="36" />
      <line class="rp-pole" x1="220" y1="140" x2="220" y2="36" />
      <rect class="rp-vb-mesh" x="60" y="40" width="160" height="24" />
      <line class="rp-vb-net-top" x1="60" y1="40" x2="220" y2="40" />
      <g class="rp-measure">
        <line x1="36" y1="40" x2="36" y2="140" />
        <path d="M31 46 L36 40 L41 46 M31 134 L36 140 L41 134" />
      </g>
      <text class="rp-tag" x="140" y="88" text-anchor="middle">muškarci 2,43 m</text>
      <text class="rp-tag" x="140" y="106" text-anchor="middle">žene 2,24 m</text>
      <text class="rp-tag rp-tag-ok" x="140" y="124" text-anchor="middle">deca — niža</text>
    }

    @case ('antenna') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="20" y1="140" x2="20" y2="56" />
      <line class="rp-pole" x1="220" y1="140" x2="220" y2="56" />
      <rect class="rp-vb-mesh" x="20" y="60" width="200" height="24" />
      <line class="rp-vb-net-top" x1="20" y1="60" x2="220" y2="60" />
      <rect class="rp-vb-cross-zone" x="50" y="8" width="140" height="52" />
      <line class="rp-vb-antenna" x1="50" y1="8" x2="50" y2="84" />
      <line class="rp-vb-antenna" x1="190" y1="8" x2="190" y2="84" />
      <use href="#rp-vb-ball" transform="translate(120 40) scale(1.3)" />
      <circle class="rp-vb-ok-ring" cx="120" cy="40" r="14" />
      <use href="#rp-vb-ball" transform="translate(205 46) scale(1.1)" />
      <circle class="rp-highlight" cx="205" cy="46" r="12" />
      <text class="rp-tag rp-tag-ok" x="120" y="110" text-anchor="middle">prolaz između antena</text>
    }

    @case ('ball-in') {
      <rect class="rp-floor" x="20" y="20" width="150" height="120" />
      <line class="rp-vb-line" x1="170" y1="20" x2="170" y2="140" />
      <use href="#rp-vb-ball" transform="translate(120 80) scale(1.6)" />
    }

    @case ('ball-on-line') {
      <rect class="rp-floor" x="20" y="20" width="150" height="120" />
      <line class="rp-vb-line" x1="170" y1="20" x2="170" y2="140" />
      <use href="#rp-vb-ball" transform="translate(170 80) scale(1.6)" />
      <circle class="rp-vb-ok-ring" cx="170" cy="80" r="16" />
    }

    @case ('ball-out') {
      <rect class="rp-floor" x="20" y="20" width="150" height="120" />
      <line class="rp-vb-line" x1="170" y1="20" x2="170" y2="140" />
      <use href="#rp-vb-ball" transform="translate(208 80) scale(1.6)" />
    }

    @case ('team-six') {
      <rect class="rp-floor" x="5" y="30" width="230" height="110" rx="3" />
      <line class="rp-vb-net-top" x1="120" y1="24" x2="120" y2="146" />
      @for (pos of [[35, 70], [35, 102], [35, 134], [85, 70], [85, 102], [85, 134]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.34" team="us" />
      }
      @for (pos of [[155, 70], [155, 102], [155, 134], [205, 70], [205, 102], [205, 134]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.34" team="them" />
      }
      <text class="rp-big" x="60" y="26" text-anchor="middle">6</text>
      <text class="rp-big" x="180" y="26" text-anchor="middle">6</text>
    }

    @case ('libero') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="70" [y]="140" [scale]="0.95" team="us" number="6" />
      <g class="rp-vb-libero">
        <g appRuleFigure [x]="160" [y]="140" [scale]="0.95" team="us" number="L" [leftArm]="[10, 24]" [rightArm]="[-10, 24]" leftHand="flat" rightHand="flat" />
      </g>
      <text class="rp-tag" x="160" y="24" text-anchor="middle">libero</text>
      <text class="rp-tag" x="70" y="24" text-anchor="middle">igrač</text>
    }

    @case ('team-sub') {
      <rect class="rp-table" x="140" y="95" width="90" height="25" rx="3" />
      <text class="rp-tag-light" x="185" y="112" text-anchor="middle">zapisnik</text>
      <g appRuleFigure [x]="120" [y]="145" [scale]="0.8" team="us" number="12" />
      <g appRuleFigure [x]="40" [y]="145" [scale]="0.8" team="us" number="4" legs="run" />
      <path class="rp-arrow-ok rp-anim-push" d="M92 70 H70 m10 -9 l-10 9 l10 9" />
      <text class="rp-big" x="185" y="70" text-anchor="middle">6</text>
      <text class="rp-tag" x="185" y="84" text-anchor="middle">u setu</text>
    }

    @case ('scoreboard') {
      <rect class="rp-board-bg" x="40" y="30" width="160" height="80" rx="10" />
      <text class="rp-board-team" x="80" y="55" text-anchor="middle">DOMAĆI</text>
      <text class="rp-board-team" x="160" y="55" text-anchor="middle">GOSTI</text>
      <text class="rp-board-score rp-board-win" x="80" y="95" text-anchor="middle">25</text>
      <text class="rp-board-score" x="160" y="95" text-anchor="middle">23</text>
      <path class="rp-crown" d="M62 18 L68 6 L74 14 L80 4 L86 14 L92 6 L98 18 Z" />
      <text class="rp-tag" x="120" y="140" text-anchor="middle">do 25, razlika bar 2</text>
    }

    @case ('fifth-set') {
      <rect class="rp-board-bg" x="40" y="30" width="160" height="80" rx="10" />
      <text class="rp-board-team" x="80" y="55" text-anchor="middle">DOMAĆI</text>
      <text class="rp-board-team" x="160" y="55" text-anchor="middle">GOSTI</text>
      <text class="rp-board-score" x="80" y="95" text-anchor="middle">13</text>
      <text class="rp-board-score rp-board-win" x="160" y="95" text-anchor="middle">15</text>
      <path class="rp-crown" d="M142 18 L148 6 L154 14 L160 4 L166 14 L172 6 L178 18 Z" />
      <text class="rp-tag" x="120" y="140" text-anchor="middle">5. set — do 15</text>
    }

    @case ('rally-point') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="120" y1="140" x2="120" y2="60" />
      <line class="rp-vb-net-side" x1="120" y1="60" x2="120" y2="86" />
      <g appRuleFigure [x]="85" [y]="140" [scale]="0.85" team="us" legs="jump" [rightArm]="[14, -30]" [leftArm]="[-10, -10]" />
      <path class="rp-dash" d="M108 38 Q160 40 190 134" />
      <use href="#rp-vb-ball" transform="translate(190 134)" />
      <path class="rp-impact" d="M178 128 l-8 -4 M202 128 l8 -4" />
      <text class="rp-big" x="200" y="60" text-anchor="middle">+1</text>
    }

    @case ('match-sets') {
      @for (set of [['25', '20', true], ['23', '25', false], ['25', '18', true], ['25', '22', true]]; track $index) {
        <g [attr.transform]="'translate(' + (14 + $index * 56) + ' 30)'">
          <rect class="rp-board-bg" width="46" height="56" rx="8" />
          <text class="rp-clock-small" x="23" y="25" text-anchor="middle">{{ set[0] }}</text>
          <text class="rp-clock-small" x="23" y="48" text-anchor="middle">{{ set[1] }}</text>
          <text class="rp-tag" x="23" y="76" text-anchor="middle">{{ $index + 1 }}. set</text>
        </g>
      }
      <text class="rp-tag" x="120" y="140" text-anchor="middle">pobeda 3:1 u setovima</text>
    }

    @case ('serve-zone') {
      <rect class="rp-zone-back" x="10" y="35" width="60" height="92" />
      <rect class="rp-floor" x="70" y="35" width="150" height="92" />
      <g class="rp-lines">
        <rect x="70" y="35" width="150" height="92" />
        <line x1="170" y1="35" x2="170" y2="127" />
      </g>
      <line class="rp-vb-net-top" x1="220" y1="28" x2="220" y2="134" />
      <g appRuleFigure [x]="42" [y]="112" [scale]="0.5" team="us" [rightArm]="[6, -30]" />
      <use href="#rp-vb-ball" transform="translate(48 46)" />
      <path class="rp-arrow-ok" d="M60 46 Q150 0 232 60" />
      <g class="rp-clock-mini" transform="translate(40 146)">
        <rect x="-18" y="-13" width="36" height="24" rx="5" />
        <text class="rp-count" y="6" text-anchor="middle">8</text>
      </g>
      <text class="rp-tag" x="130" y="146" text-anchor="middle">zona servisa</text>
    }

    @case ('serve-foot-line') {
      <rect class="rp-zone-back" x="0" y="120" width="120" height="40" />
      <rect class="rp-floor" x="120" y="120" width="120" height="40" />
      <line class="rp-vb-line" x1="120" y1="120" x2="120" y2="160" />
      <text class="rp-tag" x="55" y="156" text-anchor="middle">servis</text>
      <text class="rp-tag" x="185" y="156" text-anchor="middle">teren</text>
      <use href="#rp-vb-foot" class="rp-foot-bad" transform="translate(121 134) rotate(90)" />
      <g appRuleFigure [x]="100" [y]="122" [scale]="0.8" team="us" [rightArm]="[8, -30]" />
      <use href="#rp-vb-ball" transform="translate(114 20)" />
      <circle class="rp-highlight" cx="121" cy="134" r="12" />
    }

    @case ('serve-net') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="120" y1="140" x2="120" y2="60" />
      <line class="rp-vb-net-side" x1="120" y1="60" x2="120" y2="86" />
      <path class="rp-dash" d="M20 70 Q90 30 118 58" />
      <path class="rp-arrow-ok" d="M124 58 Q150 70 190 130" />
      <use href="#rp-vb-ball" transform="translate(120 54)" />
      <path class="rp-impact" d="M110 46 l-6 -6 M130 46 l6 -6" />
      <text class="rp-tag rp-tag-ok" x="190" y="40" text-anchor="middle">važi!</text>
    }

    @case ('serve-block') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="120" y1="140" x2="120" y2="60" />
      <line class="rp-vb-net-side" x1="120" y1="60" x2="120" y2="86" />
      <path class="rp-dash" d="M10 80 Q70 30 112 46" />
      <use href="#rp-vb-ball" transform="translate(114 46)" />
      <g appRuleFigure [x]="140" [y]="140" [scale]="0.85" team="them" legs="jump" [leftArm]="[-14, -26]" [rightArm]="[-6, -30]" leftHand="flat" rightHand="flat" />
      <text class="rp-tag" x="200" y="110" text-anchor="middle">blok servisa</text>
    }

    @case ('rotation') {
      <rect class="rp-floor" x="100" y="30" width="130" height="102" />
      <g class="rp-lines">
        <rect x="100" y="30" width="130" height="102" />
        <line x1="160" y1="30" x2="160" y2="132" />
      </g>
      <line class="rp-vb-net-top" x1="100" y1="22" x2="100" y2="140" />
      <text class="rp-tag" x="50" y="70" text-anchor="middle">mreža</text>
      <path class="rp-arrow-ok" d="M58 78 H88 m-10 -9 l10 9 l-10 9" />
      @for (spot of rotationSpots; track spot.position) {
        <g class="rp-spot rp-spot-open" [class.rp-spot-3]="spot.position === 1" [class.rp-spot-2]="spot.position !== 1" [attr.transform]="'translate(' + spot.x + ' ' + spot.y + ')'">
          <circle r="11" />
          <text y="4.5" text-anchor="middle">{{ spot.position }}</text>
        </g>
      }
      <use href="#rp-vb-ball" transform="translate(212 38) scale(0.8)" />
      <text class="rp-tag" x="165" y="150" text-anchor="middle">1 = servira</text>
    }

    @case ('side-out') {
      <rect class="rp-floor" x="100" y="30" width="130" height="102" />
      <g class="rp-lines">
        <rect x="100" y="30" width="130" height="102" />
      </g>
      <line class="rp-vb-net-top" x1="100" y1="22" x2="100" y2="140" />
      @for (spot of rotationSpots; track spot.position) {
        <g class="rp-spot rp-spot-open rp-spot-2" [attr.transform]="'translate(' + spot.x + ' ' + spot.y + ')'">
          <circle r="11" />
          <text y="4.5" text-anchor="middle">{{ spot.position }}</text>
        </g>
      }
      <path class="rp-vb-rotate" d="M152 44 H176 M204 62 V100 M176 118 H152 M124 100 V62" />
      <path class="rp-vb-rotate-head" d="M170 38 l8 6 l-8 6 M198 94 l6 8 l6 -8 M158 112 l-8 6 l8 6 M118 68 l6 -8 l6 8" />
      <text class="rp-big" x="50" y="90" text-anchor="middle">↻</text>
      <text class="rp-tag" x="50" y="120" text-anchor="middle">jedno mesto</text>
    }

    @case ('receive-order') {
      <rect class="rp-floor" x="5" y="30" width="230" height="110" rx="3" />
      <line class="rp-vb-net-top" x1="120" y1="24" x2="120" y2="146" />
      @for (pos of [[40, 64], [70, 130], [95, 80], [60, 100], [100, 132], [22, 120]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.32" team="them" />
      }
      @for (pos of [[140, 72], [140, 104], [140, 136], [195, 72], [195, 104], [195, 136]]; track $index) {
        <g appRuleFigure [x]="pos[0]" [y]="pos[1]" [scale]="0.32" team="us" />
      }
      <text class="rp-tag" x="60" y="156" text-anchor="middle">servira: slobodno</text>
      <text class="rp-tag rp-tag-ok" x="180" y="156" text-anchor="middle">prima: po redu</text>
    }

    @case ('three-touches') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="215" y1="140" x2="215" y2="60" />
      <line class="rp-vb-net-side" x1="215" y1="60" x2="215" y2="86" />
      <g appRuleFigure [x]="35" [y]="140" [scale]="0.65" team="us" legs="wide" [leftArm]="[12, 22]" [rightArm]="[-12, 22]" leftHand="flat" rightHand="flat" />
      <g appRuleFigure [x]="105" [y]="140" [scale]="0.65" team="us" [leftArm]="[6, -28]" [rightArm]="[-6, -28]" />
      <g appRuleFigure [x]="175" [y]="140" [scale]="0.65" team="us" legs="jump" [rightArm]="[10, -30]" />
      <path class="rp-dash" d="M35 102 Q70 20 105 66 Q140 10 182 50 L236 96" />
      <text class="rp-step-no" x="35" y="155" text-anchor="middle">1</text>
      <text class="rp-step-no" x="105" y="155" text-anchor="middle">2</text>
      <text class="rp-step-no" x="175" y="155" text-anchor="middle">3</text>
      <use href="#rp-vb-ball" transform="translate(182 50)" />
    }

    @case ('four-touches') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="225" y1="140" x2="225" y2="60" />
      <line class="rp-vb-net-side" x1="225" y1="60" x2="225" y2="86" />
      @for (x of [30, 80, 130, 180]; track x) {
        <g appRuleFigure [x]="x" [y]="140" [scale]="0.55" team="us" [leftArm]="[6, -28]" [rightArm]="[-6, -28]" />
        <text class="rp-step-no" [class.rp-vb-bad-no]="x === 180" [attr.x]="x" y="155" text-anchor="middle">{{ (x - 30) / 50 + 1 }}</text>
      }
      <path class="rp-dash" d="M30 72 Q55 30 80 72 Q105 30 130 72 Q155 30 180 72" />
      <use href="#rp-vb-ball" transform="translate(180 66)" />
    }

    @case ('block-touch') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="130" y1="140" x2="130" y2="60" />
      <line class="rp-vb-net-side" x1="130" y1="60" x2="130" y2="86" />
      <g appRuleFigure [x]="110" [y]="140" [scale]="0.85" team="us" legs="jump" [leftArm]="[14, -28]" [rightArm]="[20, -26]" leftHand="flat" rightHand="flat" />
      <g appRuleFigure [x]="175" [y]="140" [scale]="0.85" team="them" legs="jump" [leftArm]="[-14, -30]" />
      <use href="#rp-vb-ball" transform="translate(134 40)" />
      <path class="rp-impact" d="M124 30 l-6 -6 M144 30 l6 -6" />
      <text class="rp-big" x="40" y="60" text-anchor="middle">0</text>
      <text class="rp-tag" x="40" y="80" text-anchor="middle">ne broji se</text>
    }

    @case ('set-fingers') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" [leftArm]="[6, -28]" [rightArm]="[-6, -28]" />
      <g class="rp-anim-toss"><use href="#rp-vb-ball" transform="translate(120 14) scale(1.2)" /></g>
      <path class="rp-dash" d="M98 20 q-10 -10 -20 -4 M142 20 q10 -10 20 -4" />
    }

    @case ('dig-forearms') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" legs="wide" [leftArm]="[10, 27]" [rightArm]="[-10, 27]" leftHand="flat" rightHand="flat" />
      <use href="#rp-vb-ball" transform="translate(120 100) scale(1.2)" />
      <path class="rp-dash" d="M132 92 Q160 50 186 40" />
    }

    @case ('foot-touch') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="110" [y]="140" [scale]="1" team="us" legs="run" [leftArm]="[-20, 10]" [rightArm]="[22, 4]" />
      <use href="#rp-vb-ball" transform="translate(124 128) scale(1.2)" />
      <path class="rp-dash" d="M130 120 Q170 60 200 40" />
      <text class="rp-tag rp-tag-ok" x="190" y="110" text-anchor="middle">i nogom</text>
    }

    @case ('double-contact') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" [leftArm]="[6, -28]" [rightArm]="[-6, -28]" />
      <use href="#rp-vb-ball" transform="translate(120 20) scale(1.2)" />
      <path class="rp-dash" d="M132 18 q20 -18 26 4 q4 20 -26 6" />
      <text class="rp-step-no" x="80" y="40" text-anchor="middle">1</text>
      <text class="rp-step-no rp-vb-bad-no" x="170" y="40" text-anchor="middle">2</text>
    }

    @case ('catch') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <g appRuleFigure [x]="120" [y]="140" [scale]="1" team="us" [leftArm]="[16, 14]" [rightArm]="[-16, 14]" leftHand="flat" rightHand="flat" />
      <use href="#rp-vb-ball" transform="translate(120 80) scale(1.5)" />
      <circle class="rp-highlight" cx="120" cy="80" r="20" />
    }

    @case ('net-touch') {
      <rect class="rp-floor" x="0" y="140" width="240" height="20" />
      <line class="rp-pole" x1="20" y1="140" x2="20" y2="36" />
      <line class="rp-pole" x1="220" y1="140" x2="220" y2="36" />
      <rect class="rp-vb-mesh" x="20" y="40" width="200" height="24" />
      <line class="rp-vb-net-top" x1="20" y1="40" x2="220" y2="40" />
