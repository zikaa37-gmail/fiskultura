<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
    >
    <script
        src="https://kit.fontawesome.com/a870cd4f55.js"
        crossorigin="anonymous"
    ></script>

    <title>Fiskultura</title>

    <style>
        .title-height,
        .body-height {
            height: 50px;
        }

        .card-footer {
            background-color: white !important;
        }

        .semi-transparent {
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="d-flex flex-row flex-wrap w-100 justify-content-around my-3">

            <div
                class="card text-center mt-2 pt-2"
                style="width: 18rem;"
            >
                <i class="fa-regular fa-clipboard fa-10x"></i>
                <div class="card-body">
                    <h5 class="card-title title-height">Evidencija prisustva učenika</h5>
                    <p class="card-text body-height">evidencija prisustva učenika</p>
                    <p class="card-footer"><a
                            href="http://evidencija.fiskultura.rs"
                            class="btn btn-primary"
                        >Otvori</a></p>
                </div>
            </div>

            <div
                class="card text-center mt-2 pt-2"
                style="width: 18rem;"
            >
                <i class="fa-regular fa-clipboard fa-10x"></i>
                <div class="card-body">
                    <h5 class="card-title title-height">Elektronske pripreme</h5>
                    <p class="card-text body-height">Elektronske pripreme za nastavu fizickog vaspitanja</p>
                    <p class="card-footer">
                        <a
                            href="http://e-pripreme.fiskultura.rs"
                            class="btn btn-primary"
                        >Otvori</a>
                    </p>

                </div>
            </div>

            <div
                class="card text-center mt-2 pt-2 semi-transparent"
                style="width: 18rem;"
            >
                <i class="fa-regular fa-clipboard fa-10x"></i>
                <div class="card-body">
                    <h5 class="card-title title-height">Testiranje fizičkih sposobnosti</h5>
                    <p class="card-text body-height">Testiranje fizičkih sposobnosti učenika</p>
                    <p class="card-footer">
                        <a
                            href="http://testiranje.fiskultura.rs"
                            class="btn btn-primary"
                            style="pointer-events: none;"
                        >Otvori</a>
                    </p>
                </div>
            </div>
        </div>
    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"
    ></script>
</body>

</html>
